<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z/OS dalla A alla Z · Console e quiz</title>
<meta name="description" content="Guida interattiva per amministratori di sistema z/OS · Guía interactiva para administradores de sistemas z/OS">
<style data-zos-source="cloud.css">
.cloud-pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;max-width:220px;min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:7px 10px;font-size:12px;line-height:1.25;white-space:normal;text-align:left}
.cloud-pill:before{content:'';flex-shrink:0;width:7px;height:7px;border-radius:100%;background:var(--amb)}
.cloud-pill[data-state=saved]:before{background:var(--grn)}
.cloud-pill[data-state=error]:before,.cloud-pill[data-state=conflict]:before{background:var(--red)}
.cloud-strip{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0 0;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;line-height:1.5}
.cloud-strip b{display:block;color:var(--tx)}.cloud-strip span{color:var(--mut)}.cloud-strip button{flex-shrink:0}
.cloud-dialog{width:min(680px,calc(100vw - 24px));max-width:calc(100vw - 24px);height:min(800px,calc(100dvh - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--tx);box-shadow:var(--shadow);overflow:hidden}
.cloud-dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
.cloud-layout{height:100%;display:flex;flex-direction:column;min-width:0}
.cloud-head{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.cloud-head b{font-size:19px;display:block}.cloud-head small{color:var(--mut);display:block;font:11px var(--mono);letter-spacing:1.3px;margin-top:3px}
.cloud-close{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:24px;flex-shrink:0}
.cloud-tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cloud-tabs button{padding:8px 14px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-size:13px}.cloud-tabs button[aria-selected=true]{background:var(--acc);color:white}
.cloud-body{flex:1;min-height:0;overflow:auto;padding:20px 22px}.cloud-body h3{font-size:22px;line-height:1.25;margin:3px 0 10px}.cloud-body p{font-size:14px;color:var(--mut);line-height:1.55;margin:8px 0 16px}
.cloud-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;background:var(--card)}
.cloud-card h4{margin:0 0 8px}.cloud-card code{overflow-wrap:anywhere}
.cloud-form{display:grid;gap:13px}.cloud-form label{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.cloud-form input,.cloud-form textarea{width:100%;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;color:var(--tx);outline:none}
.cloud-form input:focus,.cloud-form textarea:focus{border-color:var(--acc)}
.cloud-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.cloud-actions .btn,.cloud-form .btn{font-size:13px;padding:10px 14px}
.cloud-message{border-left:3px solid var(--amb);background:var(--card2);padding:11px 14px;border-radius:7px;font-size:13px;line-height:1.5;margin:14px 0;white-space:pre-line;overflow-wrap:anywhere}
.cloud-message[data-kind=ok]{border-color:var(--grn)}.cloud-message[data-kind=error]{border-color:var(--red)}
.cloud-room{display:flex;flex-direction:column;height:100%;gap:12px;min-height:0}
.cloud-room-note{color:var(--mut);font-size:12px;line-height:1.5}.cloud-live{font-size:11px;letter-spacing:.4px;color:var(--mut)}.cloud-live[data-live=true]{color:var(--grn)}
.cloud-messages{flex:1;min-height:100px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg2)}
.cloud-bubble{max-width:91%;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:13px 13px 13px 3px;padding:11px 13px;word-break:break-word}
.cloud-bubble.own{align-self:flex-end;border-color:var(--acc);border-radius:13px 13px 3px 13px}.cloud-bubble header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin-bottom:6px}.cloud-bubble header strong{color:var(--acc2)}
.cloud-bubble .body{white-space:pre-wrap;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.cloud-bubble button{background:none;border:0;color:var(--mut);font-size:11px;margin-left:auto;text-decoration:underline;padding:0}
.cloud-compose{display:grid;grid-template-columns:1fr auto;gap:8px}.cloud-compose textarea{resize:vertical;min-height:55px;max-height:140px;font-size:14px}.cloud-compose button{align-self:end}
.cloud-empty{margin:auto;text-align:center;max-width:34ch;color:var(--mut);font-size:14px;padding:22px}
.cloud-sync-status{font-size:13px;color:var(--mut);margin-top:9px;line-height:1.5;overflow-wrap:anywhere}
.cloud-dialog button:disabled{opacity:.45;cursor:not-allowed}.cloud-dialog button:focus-visible,.cloud-pill:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media(max-width:780px){.top{flex-wrap:wrap}.cloud-pill{margin-left:auto;max-width:180px}.top .search{order:4;flex-basis:100%;max-width:none;margin:0}.cloud-strip{align-items:flex-start}.cloud-head,.cloud-body{padding:16px}.cloud-dialog{height:calc(100dvh - 20px);max-height:calc(100dvh - 20px)}}
@media(max-width:480px){.cloud-strip{flex-direction:column;gap:9px}.cloud-pill{max-width:150px;font-size:11px}.cloud-compose{grid-template-columns:1fr}.cloud-compose button{justify-self:end}.cloud-bubble{max-width:98%}.cloud-body h3{font-size:20px}}
@media(prefers-reduced-motion:reduce){.cloud-dialog::backdrop{backdrop-filter:none}}

</style>
<style>
:root{
  --bg:#0a0f1e;--bg2:#10172b;--card:#131b33;--card2:#18223f;--line:#243055;
  --tx:#e6ebf7;--mut:#93a0c4;--acc:#4589ff;--acc2:#78a9ff;--grn:#42be65;--amb:#f1c21b;--red:#fa4d56;--pink:#ee5396;
  --code:#0b1226;--shadow:0 10px 40px rgba(0,0,0,.35);
  --mono:ui-monospace,"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#f3f5fb;--bg2:#e9edf8;--card:#ffffff;--card2:#f6f8fd;--line:#d7deef;
  --tx:#141b2f;--mut:#5a6685;--acc:#0f62fe;--acc2:#0043ce;--grn:#198038;--amb:#b28600;--red:#da1e28;--pink:#d12771;
  --code:#101a33;--shadow:0 10px 30px rgba(30,50,110,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(69,137,255,.16),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(66,190,101,.08),transparent 60%)}
a{color:var(--acc2)}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#6929c4);color:#fff;font:700 13px var(--mono);font-style:normal}
.menu-btn{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;padding:10px 54px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:none;transition:.2s}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(69,137,255,.25)}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--mut)}
.search kbd{position:absolute;right:10px;top:9px;font:12px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--bg2)}
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:62vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:none}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px}
.results button:last-child{border:0}
.results button:hover,.results button.sel{background:var(--card2)}
.results b{display:block;font-size:14px}
.results small{color:var(--mut);font-size:12.5px}
.results mark{background:rgba(69,137,255,.3);color:inherit;border-radius:3px;padding:0 2px}
.results .tag{display:inline-block;font:11px var(--mono);color:var(--acc2);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:6px}
.ctl{display:flex;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;font:600 13px var(--mono);color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.ico{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:36px;display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.wrap{position:relative;z-index:1;display:grid;grid-template-columns:270px 1fr;gap:28px;max-width:1280px;margin:0 auto;padding:0 20px 80px}
aside{position:sticky;top:73px;align-self:start;height:calc(100vh - 85px);overflow:auto;padding:22px 4px 20px 0}
aside h6{margin:18px 0 8px;font:600 11px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}
aside a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--tx);font-size:14.5px;transition:.15s;border:1px solid transparent}
aside a:hover{background:var(--card)}
aside a.act{background:var(--card);border-color:var(--line);box-shadow:inset 3px 0 0 var(--acc)}
aside a .n{font:12px var(--mono);color:var(--mut);width:22px}
aside a .ck{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;color:transparent}
aside a.ok .ck{background:var(--grn);border-color:var(--grn);color:#04210d}
.side-prog{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--grn));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.reset{margin-top:10px;background:none;border:0;color:var(--mut);font-size:12.5px;text-decoration:underline;padding:0}
main{min-width:0}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;padding:44px 0 30px}
.eyebrow{font:600 12px var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--grn)}
.hero h1{margin:10px 0 12px;font-size:clamp(34px,5vw,58px);line-height:1.04;letter-spacing:-1.2px}
.hero h1 span{background:linear-gradient(100deg,var(--acc2),var(--grn));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:18px;max-width:52ch;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-decoration:none;color:var(--tx);transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 24px rgba(69,137,255,.35)}
.stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.stats div{font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:26px;color:var(--tx);letter-spacing:-.5px}
.term{background:var(--code);border:1px solid #243055;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;font:13px/1.55 var(--mono);color:#d4ffe0}
.term .tb{display:flex;gap:7px;align-items:center;padding:10px 14px;background:#0e1730;border-bottom:1px solid #243055;color:#7d8bb3}
.term .tb i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.term .tb i:nth-child(2){background:#febc2e}.term .tb i:nth-child(3){background:#28c840}
.term .tb span{margin-left:8px;font-size:12px}
.term pre{margin:0;padding:16px;white-space:pre-wrap;min-height:250px}
.term .l{opacity:0;animation:fi .01s forwards}
.term .y{color:#f1c21b}.term .b{color:#78a9ff}.term .g{color:#42be65}.term .d{color:#7d8bb3}
.cur{display:inline-block;width:8px;height:15px;background:#42be65;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}@keyframes fi{to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin:22px 0;box-shadow:var(--shadow);transition:border-color .3s}
.card.rv{opacity:0;transform:translateY(18px)}
.card.rv.in{opacity:1;transform:none;transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.card header{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.card .num{font:700 13px var(--mono);color:var(--acc2);background:rgba(69,137,255,.12);border:1px solid rgba(69,137,255,.35);border-radius:9px;padding:4px 9px;margin-top:6px}
.card h2{margin:0;font-size:26px;letter-spacing:-.4px;line-height:1.25;flex:1;min-width:200px}
.done{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:7px 14px;font-size:13px;display:inline-flex;gap:8px;align-items:center;transition:.2s}
.done:hover{border-color:var(--grn)}
.done.on{background:rgba(66,190,101,.15);border-color:var(--grn);color:var(--grn)}
.lead{color:var(--mut);font-size:17px;margin:14px 0 8px}
.points{list-style:none;padding:0;margin:14px 0 4px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.points li{padding:12px 14px 12px 40px;position:relative;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:14.8px}
.points li:before{content:"";position:absolute;left:14px;top:17px;width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 0 4px rgba(69,137,255,.18)}
.points code,.lead code,.gl code,.exp code{font:.88em var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--acc2)}
.tabs{display:flex;gap:6px;margin:22px 0 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--bg2);border-radius:10px 10px 0 0;padding:8px 14px;font:600 13px var(--mono);color:var(--mut)}
.tabs button.on{background:var(--code);color:#fff;border-color:#243055;border-bottom-color:var(--code)}
.code{background:var(--code);border:1px solid #243055;border-radius:0 14px 14px 14px;overflow:hidden;color:#d6def5}
.tabs+.code{margin-top:-1px}
.code .cb{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#0e1730;border-bottom:1px solid #243055;font:11.5px var(--mono);color:#7d8bb3;letter-spacing:1px}
.copy{border:1px solid #2d3c68;background:#14204a;color:#c8d4f7;border-radius:8px;padding:4px 11px;font:12px var(--mono);transition:.2s}
.copy:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.copy.ok{background:var(--grn);border-color:var(--grn);color:#04210d}
.code pre{margin:0;padding:16px 18px;overflow:auto;font:13.5px/1.6 var(--mono);tab-size:4}
.c{color:#6b7aa6;font-style:italic}.p{color:#6b7aa6}.n{color:#42be65}.k{color:#78a9ff;font-weight:700}.a{color:#f1c21b}.w{color:#ee5396}
.note{margin-top:18px;border-left:3px solid var(--amb);background:rgba(241,194,27,.08);padding:11px 15px;border-radius:0 12px 12px 0;font-size:14.5px}
.note b{color:var(--amb)}
/* builder */
.bgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;margin-top:20px}
.form{display:grid;gap:12px;align-content:start}
.form label{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:600}
.form input,.form select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:14px var(--mono);outline:none}
.form input:focus,.form select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(69,137,255,.2)}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.exp{margin-top:16px;display:grid;gap:8px;font-size:14px;color:var(--mut)}
.exp div{padding:8px 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px}
/* glossary */
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
.letters button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font:700 14px var(--mono);transition:.15s}
.letters button:hover:not(:disabled){border-color:var(--acc)}
.letters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.letters button:disabled{opacity:.3;cursor:default}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.gl{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:.25s}
.gl:hover{transform:translateY(-3px);border-color:var(--acc)}
.gl .big{position:absolute;right:10px;top:-6px;font:800 54px var(--mono);color:rgba(69,137,255,.1)}
.gl h4{margin:0 0 4px;font:700 15px var(--mono);color:var(--acc2)}
.gl p{margin:0;font-size:14.3px;color:var(--tx)}
.gl.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--grn)}100%{box-shadow:none}}
/* quiz */
.qwrap{margin-top:18px}
.qhead{display:flex;justify-content:space-between;color:var(--mut);font:13px var(--mono);margin-bottom:10px}
.qq{font-size:20px;font-weight:600;margin:6px 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opts button{text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);transition:.18s;display:flex;gap:12px}
.opts button:hover:not(:disabled){border-color:var(--acc);transform:translateX(4px)}
.opts button b{font:700 13px var(--mono);color:var(--acc2);margin-top:2px}
.opts button.good{border-color:var(--grn);background:rgba(66,190,101,.14)}
.opts button.bad{border-color:var(--red);background:rgba(250,77,86,.12)}
.opts button:disabled{cursor:default}
.fb{margin-top:14px;padding:13px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:15px}
.score{text-align:center;padding:18px}
.score .big{font:800 64px var(--mono);background:linear-gradient(100deg,var(--acc2),var(--grn));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{margin:50px 0 0;color:var(--mut);font-size:13.5px;text-align:center;border-top:1px solid var(--line);padding-top:22px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,40px);background:var(--grn);color:#04210d;padding:9px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:100}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
/* mascotte Zed */
.mas{position:fixed;right:150px;bottom:8px;z-index:75;width:104px}
.mas.hide{display:none}
.mas-body{display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));-webkit-tap-highlight-color:transparent}
.mas-body svg{display:block;width:100%;height:auto;overflow:visible;animation:masbob 3.2s ease-in-out infinite}
@keyframes masbob{50%{transform:translateY(-4px)}}
.mas-body:hover svg{animation:mashop .7s}
.mas.hop .mas-body svg{animation:mashop .8s}
@keyframes mashop{0%,100%{transform:none}30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:none}78%{transform:translateY(-7px)}}
.mas .armR,.mas .armL{transition:transform .2s}
.mas .armR{transform-origin:80px 70px}.mas .armL{transform-origin:38px 72px}
.mas.wave .armR{animation:maswave .45s ease-in-out 5}
.mas.cheer .armR{animation:maswave .3s ease-in-out 5}

<script>
/* Embedded: cloud-store.js */
/* The database is authoritative. Study data stays in memory until the server
   acknowledges it; only UI preferences and the authentication session use storage. */
(() => {
  'use strict';
  const keys = ['lang','theme','done','best','builder','lab-v1','quiz-state','chat','masMuted','masSeen'];
  const allowed = new Set(keys);
  let state = Object.create(null), silent = 0;
  const clone = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
  for (const key of ['lang','theme']) {
    try { const raw = localStorage.getItem('zoscloud:ui:'+key); if(raw) state[key]=JSON.parse(raw); } catch {}
  }
  window.ZOSStore = {
    keys,
    get(key, fallback) { return Object.hasOwn(state,key) ? clone(state[key]) : clone(fallback); },
    set(key, value) {
      if (!allowed.has(key)) return;
      const copy=clone(value);
      if (JSON.stringify(state[key])===JSON.stringify(copy)) return;
      state[key]=copy;
      if (['lang','theme'].includes(key)) try { localStorage.setItem('zoscloud:ui:'+key, JSON.stringify(copy)); } catch {}
      if (!silent) window.dispatchEvent(new CustomEvent('zos:change',{detail:{key,value:clone(copy)}}));
    },
    dump() { return clone(state); },
    replace(next) {
      state=Object.create(null);
      for (const key of keys) if (Object.hasOwn(next,key)) state[key]=clone(next[key]);
    },
    quiet(fn) { silent++; try { return fn(); } finally { silent--; } },
    legacy() {
      const data={};
      for (const key of keys) try {
        const raw=localStorage.getItem('zosguida:'+key);
        if(raw!==null) data[key]=JSON.parse(raw);
      } catch {}
      return data;
    }
  };
})();

</script>

 lead:{it:`z/OS è il sistema operativo di punta per i mainframe IBM Z. È pensato per carichi di lavoro enormi, disponibilità continua e sicurezza elevata: banche, assicurazioni e pubblica amministrazione lo usano per le transazioni critiche.`,

{id:'access',
 t:{it:'Accesso: TSO e ISPF',es:'Acceso: TSO e ISPF'},
 lead:{it:`Si lavora quasi sempre da un terminale 3270 (o emulatore) con <b>TSO/E</b>, la shell interattiva di z/OS, e <b>ISPF</b>, l'ambiente a pannelli per editare dataset, lanciare job e cercare file.`,
       es:`Se trabaja casi siempre desde un terminal 3270 (o emulador) con <b>TSO/E</b>, el shell interactivo de z/OS, e <b>ISPF</b>, el entorno de paneles para editar datasets, lanzar jobs y buscar ficheros.`},
 pts:{it:[`<b>3.4</b> (DSLIST): elenca e gestisce i dataset.`,`<b>3.2</b>: utilità dataset, per allocare e cancellare.`,`<b>=6</b>: riga di comando TSO dentro ISPF.`,`<b>PF3</b> esce dal pannello, <b>PF7/PF8</b> scorrono su e giù.`,`<b>SUB</b> sottomette il JCL che stai editando, <b>CANCEL</b> annulla le modifiche.`,`<b>X</b> escludi righe, <b>F</b> cerca, <b>C</b> cambia: comandi di editor molto usati.`],
      es:[`<b>3.4</b> (DSLIST): lista y gestiona datasets.`,`<b>3.2</b>: utilidades de dataset, para asignar y borrar.`,`<b>=6</b>: línea de comandos TSO dentro de ISPF.`,`<b>PF3</b> sale del panel, <b>PF7/PF8</b> suben y bajan.`,`<b>SUB</b> envía el JCL que estás editando, <b>CANCEL</b> descarta los cambios.`,`<b>X</b> excluye líneas, <b>F</b> busca, <b>C</b> cambia: comandos de editor muy usados.`]},
 ex:[{l:{it:'Comandi TSO',es:'Comandos TSO'},lg:'txt',

{id:'datasets',
 t:{it:'Dataset e catalogo',es:'Datasets y catálogo'},
 lead:{it:`In z/OS i file si chiamano <b>dataset</b>. Il nome è composto da qualificatori separati da punti (massimo 44 caratteri in totale, 8 per qualificatore) e il <b>catalogo</b> indica su quale volume si trovano.`,
       es:`En z/OS los ficheros se llaman <b>datasets</b>. El nombre se compone de calificadores separados por puntos (máximo 44 caracteres en total, 8 por calificador) y el <b>catálogo</b> indica en qué volumen están.`},
 pts:{it:[`<b>PS</b>: sequenziale, un file piatto di record.`,`<b>PDS / PDSE</b>: libreria con <i>membri</i>, come una cartella di file. Il PDSE è la versione moderna, senza bisogno di compressione.`,`<b>VSAM</b>: KSDS (per chiave), ESDS (per ordine), RRDS (per numero di record), LDS.`,`<b>GDG</b>: gruppo di generazioni, versioni numerate dello stesso dataset (<code>.G0001V00</code>).`,`<b>RECFM</b> e <b>LRECL</b> descrivono il formato dei record: <code>FB 80</code> è il classico.`,`Il primo qualificatore (<b>HLQ</b>) è di solito lo userid o il sistema proprietario.`],
      es:[`<b>PS</b>: secuencial, un fichero plano de registros.`,`<b>PDS / PDSE</b>: librería con <i>miembros</i>, como una carpeta de ficheros. El PDSE es la versión moderna, sin necesidad de compresión.`,`<b>VSAM</b>: KSDS (por clave), ESDS (por orden), RRDS (por número de registro), LDS.`,`<b>GDG</b>: grupo de generaciones, versiones numeradas del mismo dataset (<code>.G0001V00</code>).`,`<b>RECFM</b> y <b>LRECL</b> describen el formato de registro: <code>FB 80</code> es el clásico.`,`El primer calificador (<b>HLQ</b>) suele ser el userid o el sistema propietario.`]},
 ex:[{l:{it:'Allocare con IEFBR14',es:'Asignar con IEFBR14'},lg:'jcl',
  c:{it:`//ALLOC   JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X,
//         NOTIFY=&SYSUID
//STEP1    EXEC PGM=IEFBR14
//NEWDS    DD DSN=&SYSUID..TEST.DATA,
//         DISP=(NEW,CATLG,DELETE),
//         UNIT=SYSDA,
//         SPACE=(TRK,(5,5),RLSE),
//         DCB=(RECFM=FB,LRECL=80,BLKSIZE=0)`,es:null},

{id:'jcl',
 t:{it:'JCL: JOB, EXEC e DD',es:'JCL: JOB, EXEC y DD'},
 lead:{it:`Il <b>Job Control Language</b> descrive al sistema cosa eseguire e con quali dati. Ogni riga inizia con <code>//</code> e le istruzioni principali sono tre.`,
       es:`El <b>Job Control Language</b> describe al sistema qué ejecutar y con qué datos. Cada línea empieza con <code>//</code> y las instrucciones principales son tres.`},
 pts:{it:[`<b>JOB</b>: identifica il lavoro, la classe, la classe di output (<code>MSGCLASS</code>) e chi avvisare.`,`<b>EXEC</b>: lancia un programma (<code>PGM=</code>) o una procedura catalogata (<code>PROC</code>).`,`<b>DD</b>: descrive un dataset o uno stream, collegato a un nome che il programma conosce.`,`<code>DISP=(stato,normale,anomalo)</code>: cosa fare del dataset a fine step.`,`<code>COND</code> e <code>IF/THEN/ELSE</code> condizionano l'esecuzione degli step in base al return code.`,`<code>//SYSIN DD *</code> inserisce dati o comandi direttamente nel job, fino a <code>/*</code>.`],
      es:[`<b>JOB</b>: identifica el trabajo, la clase, la clase de salida (<code>MSGCLASS</code>) y a quién avisar.`,`<b>EXEC</b>: lanza un programa (<code>PGM=</code>) o un procedimiento catalogado (<code>PROC</code>).`,`<b>DD</b>: describe un dataset o un flujo, enlazado a un nombre que el programa conoce.`,`<code>DISP=(estado,normal,anómalo)</code>: qué hacer con el dataset al final del paso.`,`<code>COND</code> e <code>IF/THEN/ELSE</code> condicionan la ejecución de los pasos según el return code.`,`<code>//SYSIN DD *</code> inserta datos o comandos directamente en el job, hasta <code>/*</code>.`]},

  c:{it:`//MULTI   JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X

//COPIA    EXEC PGM=IEBGENER
//SYSPRINT DD SYSOUT=*
//SYSIN    DD DUMMY

//SYSUT2   DD DSN=USER1.COPIA,DISP=(NEW,CATLG,DELETE),
//         SPACE=(TRK,(5,5),RLSE),UNIT=SYSDA,
//         DCB=*.SYSUT1
//* STEP 2: solo se lo step 1 e' andato bene
//         IF (COPIA.RC = 0) THEN
//STAMPA   EXEC PGM=IEBGENER
//SYSPRINT DD SYSOUT=*
//SYSIN    DD DUMMY
//SYSUT1   DD DSN=USER1.COPIA,DISP=SHR
//SYSUT2   DD SYSOUT=*

//* PASO 1: copia
//COPIA    EXEC PGM=IEBGENER
//SYSPRINT DD SYSOUT=*
//SYSIN    DD DUMMY

//         SPACE=(TRK,(5,5),RLSE),UNIT=SYSDA,
//         DCB=*.SYSUT1
//* PASO 2: solo si el paso 1 fue bien
//         IF (COPIA.RC = 0) THEN
//IMPRIME  EXEC PGM=IEBGENER
//SYSPRINT DD SYSOUT=*
//SYSIN    DD DUMMY
//SYSUT1   DD DSN=USER1.COPIA,DISP=SHR
//SYSUT2   DD SYSOUT=*
//         ENDIF`}}],
 note:{it:`<b>Return code:</b> 0 = tutto bene, 4 = avviso, 8 = errore, 12 = errore grave, 16 = errore irrecuperabile.`,es:`<b>Return code:</b> 0 = todo bien, 4 = aviso, 8 = error, 12 = error grave, 16 = error irrecuperable.`}},

{id:'utils',
 t:{it:'Utility di sistema',es:'Utilidades del sistema'},
 lead:{it:`Un amministratore usa ogni giorno un piccolo gruppo di programmi di servizio: copiare, ordinare, definire VSAM e gestire librerie.`,
       es:`Un administrador usa cada día un pequeño grupo de programas de servicio: copiar, ordenar, definir VSAM y gestionar librerías.`},
 pts:{it:[`<b>IEFBR14</b>: non fa nulla, serve a far allocare o cancellare dataset dalle DD.`,`<b>IEBGENER</b>: copia sequenziali e può stampare.`,`<b>IEBCOPY</b>: copia, comprime e ricarica librerie partizionate.`,`<b>IDCAMS</b>: i comandi di <i>Access Method Services</i> (DEFINE, REPRO, LISTCAT, DELETE).`,`<b>SORT</b> (DFSORT o SYNCSORT): ordina, fonde, filtra e riformatta i record.`,`<b>ADRDSSU</b>: backup, restore e spostamento di dati a livello di volume o dataset.`],
      es:[`<b>IEFBR14</b>: no hace nada, sirve para que las DD asignen o borren datasets.`,`<b>IEBGENER</b>: copia secuenciales y puede imprimir.`,`<b>IEBCOPY</b>: copia, comprime y recarga librerías particionadas.`,`<b>IDCAMS</b>: los comandos de <i>Access Method Services</i> (DEFINE, REPRO, LISTCAT, DELETE).`,`<b>SORT</b> (DFSORT o SYNCSORT): ordena, fusiona, filtra y reformatea registros.`,`<b>ADRDSSU</b>: backup, restore y movimiento de datos a nivel de volumen o dataset.`]},
 ex:[{l:'IDCAMS',lg:'jcl',c:{it:`//DEFVSAM JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X
//STEP1    EXEC PGM=IDCAMS
//SYSPRINT DD SYSOUT=*
//SYSIN    DD *
  DEFINE CLUSTER (NAME(USER1.CLIENTI.KSDS) -
         INDEXED KEYS(8 0) RECORDSIZE(80 80) -
         TRACKS(5 5) FREESPACE(10 10)) -
         DATA  (NAME(USER1.CLIENTI.KSDS.DATA)) -
         INDEX (NAME(USER1.CLIENTI.KSDS.INDEX))
/*`,es:null}},
 {l:'SORT',lg:'jcl',c:{it:`//ORDINA  JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X
//STEP1    EXEC PGM=SORT
//SYSOUT   DD SYSOUT=*
//SORTIN   DD DSN=USER1.CLIENTI,DISP=SHR
//SORTOUT  DD DSN=USER1.CLIENTI.ORD,DISP=(NEW,CATLG,DELETE),
//         SPACE=(TRK,(5,5),RLSE),UNIT=SYSDA,
//         DCB=(RECFM=FB,LRECL=80,BLKSIZE=0)
//SYSIN    DD *
  SORT FIELDS=(1,10,CH,A)
  INCLUDE COND=(11,2,CH,EQ,C'IT')
/*`,es:null}},
 {l:'IEBCOPY',lg:'jcl',c:{it:`//COMPRIME JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X
//STEP1    EXEC PGM=IEBCOPY
//SYSPRINT DD SYSOUT=*
//LIB      DD DSN=USER1.MIA.LIBRERIA,DISP=OLD
//SYSIN    DD *
  COPY INDD=LIB,OUTDD=LIB
/*`,es:null}}]},

{id:'sdsf',
 t:{it:'SDSF: job e output',es:'SDSF: jobs y salida'},
 lead:{it:`<b>SDSF</b> è lo strumento per vedere i job in coda, in esecuzione o finiti, leggerne l'output e controllare il log di sistema.`,
       es:`<b>SDSF</b> es la herramienta para ver los jobs en cola, en ejecución o terminados, leer su salida y consultar el log del sistema.`},
 pts:{it:[`<b>ST</b> mostra lo stato di tutti i job; <b>DA</b> i processi attivi.`,`<b>LOG</b> apre il syslog; <b>H</b> mostra l'output trattenuto.`,`Riga di comando: <code>PREFIX USER1*</code> filtra per nome job e <code>OWNER USER1</code> per proprietario.`,`Digita <b>S</b> accanto a un job per aprirne l'output, <b>?</b> per elencarne gli step e i file.`,`<b>P</b> elimina l'output, <b>C</b> cancella un job in esecuzione.`,`Dentro un job: <b>F</b> cerca, <b>RFIND</b> ripete la ricerca e <b>TOP</b>/<b>BOTTOM</b> saltano agli estremi.`],
      es:[`<b>ST</b> muestra el estado de todos los jobs; <b>DA</b> los procesos activos.`,`<b>LOG</b> abre el syslog; <b>H</b> muestra la salida retenida.`,`Línea de comandos: <code>PREFIX USER1*</code> filtra por nombre de job y <code>OWNER USER1</code> por propietario.`,`Escribe <b>S</b> junto a un job para abrir su salida, <b>?</b> para listar sus pasos y ficheros.`,`<b>P</b> elimina la salida, <b>C</b> cancela un job en ejecución.`,`Dentro de un job: <b>F</b> busca, <b>RFIND</b> repite la búsqueda y <b>TOP</b>/<b>BOTTOM</b> saltan a los extremos.`]},
 ex:[{l:{it:'Comandi JES2',es:'Comandos JES2'},lg:'txt',c:{it:`# Job attivi
$DA
# Dettagli di un job
$DJ(12345)
# Ferma e riavvia l'elaborazione dei job
$PJOBQ
$SJOBQ
# Rilascia / trattieni un job
$AJ(12345)
$HJ(12345)
# Cancella un job
$CJ(12345)`,es:`# Jobs activos
$DA
# Detalles de un job
$DJ(12345)
# Detiene y reinicia el procesamiento de jobs
$PJOBQ
$SJOBQ
# Libera / retiene un job
$AJ(12345)
$HJ(12345)
# Cancela un job
$CJ(12345)`}}]},

{id:'racf',
 t:{it:'Sicurezza con RACF',es:'Seguridad con RACF'},
 lead:{it:`<b>RACF</b> (Resource Access Control Facility) decide chi può accedere a quali risorse. Altri prodotti equivalenti sono ACF2 e Top Secret, ma i concetti sono gli stessi.`,
       es:`<b>RACF</b> (Resource Access Control Facility) decide quién puede acceder a qué recursos. Otros productos equivalentes son ACF2 y Top Secret, pero los conceptos son los mismos.`},
 pts:{it:[`<b>Utenti</b> e <b>gruppi</b> sono i soggetti; ogni utente ha un gruppo di default.`,`I <b>profili</b> proteggono le risorse: dataset, transazioni, comandi e altro, per <b>classe</b> (DATASET, FACILITY, OPERCMDS…).`,`<b>UACC</b> è l'accesso universale; <b>PERMIT</b> concede accessi a utenti o gruppi specifici.`,`Livelli di accesso: NONE, READ, UPDATE, CONTROL, ALTER.`,`I <b>generic profile</b> con <code>**</code> proteggono molti dataset con un solo profilo.`,`Dopo modifiche a classi in RACLIST serve <code>SETROPTS RACLIST(classe) REFRESH</code>.`],
      es:[`<b>Usuarios</b> y <b>grupos</b> son los sujetos; cada usuario tiene un grupo por defecto.`,`Los <b>perfiles</b> protegen recursos: datasets, transacciones, comandos y más, por <b>clase</b> (DATASET, FACILITY, OPERCMDS…).`,`<b>UACC</b> es el acceso universal; <b>PERMIT</b> concede acceso a usuarios o grupos concretos.`,`Niveles de acceso: NONE, READ, UPDATE, CONTROL, ALTER.`,`Los <b>perfiles genéricos</b> con <code>**</code> protegen muchos datasets con un solo perfil.`,`Tras cambiar clases en RACLIST hace falta <code>SETROPTS RACLIST(clase) REFRESH</code>.`]},
 ex:[{l:'RACF',lg:'txt',c:{it:`# Crea un utente
ADDUSER USER2 NAME('MARIO ROSSI') DFLTGRP(SVILUPPO) PASSWORD(Temp1234) TSO(ACCTNUM(ACCT) PROC(IKJACCNT))
# Proteggi tutti i dataset di un livello
ADDSD 'USER1.**' UACC(NONE)
# Concedi lettura a un utente
PERMIT 'USER1.**' CLASS(DATASET) ID(USER2) ACCESS(READ)
# Mostra info utente e profilo
LISTUSER USER2
LISTDSD DATASET('USER1.TEST.DATA') ALL
# Riattiva un utente revocato e imposta nuova password
ALTUSER USER2 RESUME PASSWORD(Nuova123)
# Applica le modifiche alla classe in memoria
SETROPTS RACLIST(FACILITY) REFRESH`,
  es:`# Crea un usuario
ADDUSER USER2 NAME('MARIO ROSSI') DFLTGRP(DESARROLLO) PASSWORD(Temp1234) TSO(ACCTNUM(ACCT) PROC(IKJACCNT))
# Protege todos los datasets de un nivel
ADDSD 'USER1.**' UACC(NONE)
# Concede lectura a un usuario
PERMIT 'USER1.**' CLASS(DATASET) ID(USER2) ACCESS(READ)
# Muestra info de usuario y perfil
LISTUSER USER2
LISTDSD DATASET('USER1.TEST.DATA') ALL
# Reactiva un usuario revocado y fija nueva contraseña
ALTUSER USER2 RESUME PASSWORD(Nueva123)
# Aplica los cambios de la clase en memoria
SETROPTS RACLIST(FACILITY) REFRESH`}}],
 note:{it:`<b>Buona pratica:</b> usa password temporanee uniche: quelle impostate da un amministratore risultano scadute, quindi l'utente ne sceglie una propria al primo accesso (<code>NOEXPIRED</code> evita questo comportamento).`,es:`<b>Buena práctica:</b> usa contraseñas temporales únicas: las fijadas por un administrador quedan caducadas, así que el usuario elige la suya en el primer acceso (<code>NOEXPIRED</code> evita este comportamiento).`}},

{id:'console',
 t:{it:'Console e comandi operatore',es:'Consola y comandos de operador'},
 lead:{it:`Dalla console z/OS si controllano il sistema, i dispositivi e le started task. I comandi si digitano in SDSF (<code>/D A,L</code>) o in una console vera e propria.`,
       es:`Desde la consola z/OS se controlan el sistema, los dispositivos y las started tasks. Los comandos se escriben en SDSF (<code>/D A,L</code>) o en una consola propiamente dicha.`},
 pts:{it:[`<b>D</b> (DISPLAY) mostra informazioni senza modificare nulla.`,`<b>V</b> (VARY) mette online/offline dispositivi e altre risorse.`,`<b>S</b> (START), <b>P</b> (STOP), <b>C</b> (CANCEL) e <b>F</b> (MODIFY) governano le started task.`,`<b>T</b> (SET) applica membri PARMLIB senza riavvio, come <code>T SMF=00</code>.`,`<b>SETPROG</b> modifica dinamicamente APF, LNKLST e LPA.`,`<b>K</b> gestisce la console stessa.`],
      es:[`<b>D</b> (DISPLAY) muestra información sin modificar nada.`,`<b>V</b> (VARY) pone online/offline dispositivos y otros recursos.`,`<b>S</b> (START), <b>P</b> (STOP), <b>C</b> (CANCEL) y <b>F</b> (MODIFY) gobiernan las started tasks.`,`<b>T</b> (SET) aplica miembros PARMLIB sin reiniciar, como <code>T SMF=00</code>.`,`<b>SETPROG</b> modifica dinámicamente APF, LNKLST y LPA.`,`<b>K</b> gestiona la propia consola.`]},
 ex:[{l:{it:'Operatore',es:'Operador'},lg:'txt',c:{it:`# Avvia, modifica e ferma una started task
S MIOSERV
F MIOSERV,STATUS
P MIOSERV
# Porta online un dispositivo
V 0A00,ONLINE
# Elenca le librerie APF
D PROG,APF
# Aggiungi una libreria APF a caldo
SETPROG APF,ADD,DSNAME=USER1.LOADLIB,SMS
# Elenca i simboli di sistema
D SYMBOLS
# Verifica la configurazione SMF
D SMF,O`,es:`# Arranca, modifica y detiene una started task
S MISERV
F MISERV,STATUS
P MISERV
# Pone online un dispositivo
V 0A00,ONLINE
# Lista las librerías APF
D PROG,APF
# Añade una librería APF en caliente
SETPROG APF,ADD,DSNAME=USER1.LOADLIB,SMS
# Lista los símbolos del sistema
D SYMBOLS
# Verifica la configuración SMF
D SMF,O`}}]},

{id:'sms',
 t:{it:'Storage e DFSMS',es:'Almacenamiento y DFSMS'},
 lead:{it:`Con <b>DFSMS</b> il sistema decide dove mettere i dati in base a regole, invece di far scegliere i volumi a mano. Si parla di <i>Storage Management Subsystem</i> (SMS).`,
       es:`Con <b>DFSMS</b> el sistema decide dónde poner los datos según reglas, en vez de elegir volúmenes a mano. Se habla del <i>Storage Management Subsystem</i> (SMS).`},
 pts:{it:[`<b>Data Class</b>: attributi tecnici, come RECFM, LRECL e spazio.`,`<b>Storage Class</b>: prestazioni e disponibilità richieste.`,`<b>Management Class</b>: backup, migrazione e scadenza.`,`<b>Storage Group</b>: insieme di volumi che ospitano i dati.`,`Le <b>routine ACS</b> assegnano le classi a ogni nuovo dataset in base al nome, al job o all'utente.`,`<b>ISMF</b> è il pannello ISPF per gestire tutto questo; <b>DFHSM</b> si occupa di migrazione e backup automatici.`],
      es:[`<b>Data Class</b>: atributos técnicos, como RECFM, LRECL y espacio.`,`<b>Storage Class</b>: rendimiento y disponibilidad requeridos.`,`<b>Management Class</b>: backup, migración y caducidad.`,`<b>Storage Group</b>: conjunto de volúmenes que alojan los datos.`,`Las <b>rutinas ACS</b> asignan las clases a cada nuevo dataset según el nombre, el job o el usuario.`,`<b>ISMF</b> es el panel ISPF para gestionarlo; <b>DFHSM</b> se ocupa de migración y backup automáticos.`]},
 ex:[{l:{it:'HSM e SMS',es:'HSM y SMS'},lg:'txt',c:{it:`# Migra e richiama un dataset
HMIGRATE 'USER1.TEST.DATA'
HRECALL 'USER1.TEST.DATA'
# Backup immediato
HBACKDS 'USER1.TEST.DATA'
# Stato di SMS
D SMS
D SMS,STORGRP(ALL)
# Attiva una nuova configurazione SMS
SETSMS SCDS(SYS1.SMS.SCDS)`,es:`# Migra y recupera un dataset
HMIGRATE 'USER1.TEST.DATA'
HRECALL 'USER1.TEST.DATA'
# Backup inmediato
HBACKDS 'USER1.TEST.DATA'
# Estado de SMS
D SMS
D SMS,STORGRP(ALL)
# Activa una nueva configuración SMS
SETSMS SCDS(SYS1.SMS.SCDS)`}}]},

{id:'parmlib',
 t:{it:'PARMLIB, IPL e avvio',es:'PARMLIB, IPL y arranque'},
 lead:{it:`All'avvio (<b>IPL</b>) z/OS legge una serie di membri di configurazione dalla concatenazione <b>PARMLIB</b>. Conoscerli è la base per configurare il sistema.`,
       es:`En el arranque (<b>IPL</b>) z/OS lee una serie de miembros de configuración de la concatenación <b>PARMLIB</b>. Conocerlos es la base para configurar el sistema.`},
 pts:{it:[`<b>LOADxx</b>: dove trovare IEASYSxx, il nucleo e il catalogo master.`,`<b>IEASYSxx</b>: parametri principali del sistema.`,`<b>PROGxx</b>: librerie APF, LNKLST ed exit dinamiche.`,`<b>SMFPRMxx</b>: cosa registrare in SMF.`,`<b>BPXPRMxx</b>: file system e parametri di USS (Unix System Services).`,`<b>COUPLExx</b>: configurazione del Sysplex.`,`<b>IEFSSNxx</b>: sottosistemi come JES2 e DB2.`],
      es:[`<b>LOADxx</b>: dónde encontrar IEASYSxx, el núcleo y el catálogo maestro.`,`<b>IEASYSxx</b>: parámetros principales del sistema.`,`<b>PROGxx</b>: librerías APF, LNKLST y exits dinámicas.`,`<b>SMFPRMxx</b>: qué registrar en SMF.`,`<b>BPXPRMxx</b>: sistemas de ficheros y parámetros de USS (Unix System Services).`,`<b>COUPLExx</b>: configuración del Sysplex.`,`<b>IEFSSNxx</b>: subsistemas como JES2 y DB2.`]},
 ex:[{l:'LOADxx',lg:'txt',c:{it:`# Esempio semplificato di membro LOADxx
IEASYM  00
SYSPARM 00
PARMLIB USER.PARMLIB                  VOL001
PARMLIB SYS1.PARMLIB                  VOL001
NUCLEUS 1
# Verifica con il sistema avviato
D IPLINFO
D PARMLIB`,es:`# Ejemplo simplificado de miembro LOADxx
IEASYM  00
SYSPARM 00
PARMLIB USER.PARMLIB                  VOL001
PARMLIB SYS1.PARMLIB                  VOL001
NUCLEUS 1
# Verifica con el sistema arrancado
D IPLINFO
D PARMLIB`}}],
 note:{it:`<b>Prudenza:</b> prima di cambiare un membro PARMLIB, tieni sempre una copia e usa i controlli di sintassi (come <code>T</code> con membro di prova) quando disponibili.`,es:`<b>Prudencia:</b> antes de cambiar un miembro PARMLIB, conserva siempre una copia y usa las comprobaciones de sintaxis (como <code>T</code> con miembro de prueba) cuando existan.`}},

{id:'rexx',
 t:{it:'REXX ed EXEC',es:'REXX y EXEC'},
 lead:{it:`<b>REXX</b> è il linguaggio di scripting di z/OS: ideale per automatizzare attività di TSO, ISPF e job ripetitivi. Gli script si salvano in librerie <b>EXEC</b> (SYSEXEC o SYSPROC).`,
       es:`<b>REXX</b> es el lenguaje de scripting de z/OS: ideal para automatizar tareas de TSO, ISPF y jobs repetitivos. Los scripts se guardan en librerías <b>EXEC</b> (SYSEXEC o SYSPROC).`},
 pts:{it:[`La prima riga deve contenere il commento <code>/* REXX */</code>.`,`<code>SAY</code> stampa, <code>PULL</code>/<code>ARG</code> leggono, <code>PARSE</code> divide le stringhe.`,`I comandi tra virgolette vanno all'ambiente corrente (TSO, ISPEXEC, SDSF…).`,`<code>EXECIO</code> legge e scrive dataset riga per riga.`,`Le <b>stem variable</b> come <code>rec.1</code>, <code>rec.2</code> fanno da array; <code>rec.0</code> contiene il conteggio.`,`Si lancia con <code>EXEC 'USER1.REXX(NOME)' EXEC</code> o semplicemente <code>%NOME</code>.`],
      es:[`La primera línea debe contener el comentario <code>/* REXX */</code>.`,`<code>SAY</code> imprime, <code>PULL</code>/<code>ARG</code> leen, <code>PARSE</code> divide cadenas.`,`Los comandos entre comillas van al entorno actual (TSO, ISPEXEC, SDSF…).`,`<code>EXECIO</code> lee y escribe datasets línea a línea.`,`Las <b>stem variables</b> como <code>rec.1</code>, <code>rec.2</code> hacen de array; <code>rec.0</code> guarda el contador.`,`Se lanza con <code>EXEC 'USER1.REXX(NOMBRE)' EXEC</code> o simplemente <code>%NOMBRE</code>.`]},
 ex:[{l:{it:'Leggere un dataset',es:'Leer un dataset'},lg:'rexx',c:{it:`/* REXX */
ARG dsn
"ALLOC F(MYDD) DA('"dsn"') SHR REUSE"
"EXECIO * DISKR MYDD (STEM rec. FINIS"
"FREE F(MYDD)"
DO i = 1 TO rec.0
  SAY RIGHT(i,4) rec.i
END
SAY 'Righe lette:' rec.0
EXIT 0`,es:`/* REXX */
ARG dsn
"ALLOC F(MYDD) DA('"dsn"') SHR REUSE"
"EXECIO * DISKR MYDD (STEM rec. FINIS"
"FREE F(MYDD)"
DO i = 1 TO rec.0
  SAY RIGHT(i,4) rec.i
END
SAY 'Líneas leídas:' rec.0
EXIT 0`}},
 {l:{it:'Eseguire da JCL',es:'Ejecutar desde JCL'},lg:'jcl',c:{it:`//REXXJOB JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X
//STEP1    EXEC PGM=IKJEFT01,PARM='%LEGGI USER1.TEST.DATA'
//SYSEXEC  DD DSN=USER1.REXX,DISP=SHR
//SYSTSPRT DD SYSOUT=*
//SYSTSIN  DD DUMMY`,es:null}}]},

{id:'diag',
 t:{it:'Diagnostica e abend',es:'Diagnóstico y abend'},
 lead:{it:`Quando un job fallisce, il primo passo è leggere il codice di terminazione e i messaggi nel JESMSGLG, JESJCL e JESYSMSG. Questi sono gli abend più comuni.`,
       es:`Cuando un job falla, el primer paso es leer el código de terminación y los mensajes en JESMSGLG, JESJCL y JESYSMSG. Estos son los abends más comunes.`},
 pts:{it:[`<b>S0C7</b>: dati numerici non validi in un campo (data exception).`,`<b>S0C4</b>: accesso a memoria non permesso (protection exception).`,`<b>S806</b>: modulo non trovato in STEPLIB, JOBLIB o LNKLST.`,`<b>S222</b>: il job è stato cancellato dall'operatore. <b>S322</b>: tempo CPU superato.`,`<b>B37 / D37 / E37</b>: spazio esaurito su volume, primario o extent.`,`<b>S913</b>: RACF nega l'accesso alla risorsa. <b>S878</b>: memoria virtuale insufficiente.`,`<b>JCL error</b>: lo step non parte; leggi il messaggio <code>IEF...</code> in JESMSGLG.`],
      es:[`<b>S0C7</b>: datos numéricos inválidos en un campo (data exception).`,`<b>S0C4</b>: acceso a memoria no permitido (protection exception).`,`<b>S806</b>: módulo no encontrado en STEPLIB, JOBLIB o LNKLST.`,`<b>S222</b>: el job fue cancelado por el operador. <b>S322</b>: tiempo de CPU excedido.`,`<b>B37 / D37 / E37</b>: espacio agotado en volumen, primario o extents.`,`<b>S913</b>: RACF deniega el acceso al recurso. <b>S878</b>: memoria virtual insuficiente.`,`<b>JCL error</b>: el paso no arranca; lee el mensaje <code>IEF...</code> en JESMSGLG.`]},
 ex:[{l:{it:'Rimedi comuni',es:'Remedios comunes'},lg:'jcl',c:{it:`//* Spazio insufficiente (B37/D37/E37): più spazio e extent
//         SPACE=(CYL,(50,20),RLSE),
//* Modulo non trovato (S806): aggiungi la libreria
//STEPLIB  DD DSN=USER1.LOADLIB,DISP=SHR
//* Dump per diagnosi dopo un S0C4
//SYSUDUMP DD SYSOUT=*
//* Più memoria e tempo per lo step
//STEP1    EXEC PGM=MIOPROG,REGION=0M,TIME=1440`,es:`//* Espacio insuficiente (B37/D37/E37): más espacio y extents
//         SPACE=(CYL,(50,20),RLSE),
//* Módulo no encontrado (S806): añade la librería
//STEPLIB  DD DSN=USER1.LOADLIB,DISP=SHR
//* Dump para diagnóstico tras un S0C4
//SYSUDUMP DD SYSOUT=*
//* Más memoria y tiempo para el paso
//STEP1    EXEC PGM=MIPROG,REGION=0M,TIME=1440`}}],
 note:{it:`<b>Strumenti:</b> <b>SMF</b> registra l'attività del sistema, <b>RMF</b> monitora le prestazioni e <b>SDSF LOG</b> mostra gli eventi in tempo reale.`,es:`<b>Herramientas:</b> <b>SMF</b> registra la actividad del sistema, <b>RMF</b> monitoriza el rendimiento y <b>SDSF LOG</b> muestra los eventos en tiempo real.`}}
];

const G=[
['A','ABEND',{it:`Terminazione anomala di un programma, identificata da un codice (S0C7, S806…).`,es:`Terminación anómala de un programa, identificada por un código (S0C7, S806…).`}],
['B','Batch',{it:`Elaborazione non interattiva di job inviati tramite JCL.`,es:`Procesamiento no interactivo de jobs enviados mediante JCL.`}],
['C','Catalog',{it:`Registro che associa i nomi dei dataset ai volumi dove risiedono.`,es:`Registro que asocia los nombres de dataset con los volúmenes donde residen.`}],
['C','CICS',{it:`Gestore di transazioni online molto diffuso su z/OS.`,es:`Gestor de transacciones online muy extendido en z/OS.`}],
['D','DASD',{it:`Direct Access Storage Device: i dischi del mainframe.`,es:`Direct Access Storage Device: los discos del mainframe.`}],
['D','DISP',{it:`Parametro DD che indica stato e destino di un dataset.`,es:`Parámetro DD que indica el estado y destino de un dataset.`}],

s:{
intro:{t:`What z/OS is and how it is built`,
 lead:`z/OS is the flagship operating system for IBM Z mainframes. It is designed for huge workloads, continuous availability and strong security: banks, insurers and public administrations use it for their critical transactions.`,
 pts:[`An <b>LPAR</b> is a logical partition: several independent z/OS images run on one physical machine.`,
  `Every program lives in an <b>address space</b> with its own isolated virtual memory.`,
  `<b>JES2</b> (or JES3) manages job entry, the queue and the output.`,
  `A <b>Parallel Sysplex</b> joins several LPARs with a Coupling Facility to share data and workload.`,
  `<b>Started tasks</b> are the system services started with the <code>S</code> command.`,
  `The native character set is <b>EBCDIC</b>, not ASCII: it matters when transferring files.`],
 ex:[{c:`# Information about the running system
D IPLINFO
# Active address spaces
D A,L
# CPU status
D M=CPU
# Online disks
D U,DASD,ONLINE
# PARMLIB libraries in use
D PARMLIB`,l:`Useful console commands`}]},
access:{t:`Access: TSO and ISPF`,
 lead:`Work is almost always done from a 3270 terminal (or emulator) with <b>TSO/E</b>, the interactive shell of z/OS, and <b>ISPF</b>, the panel environment for editing datasets, submitting jobs and finding files.`,
 pts:[`<b>3.4</b> (DSLIST): lists and manages datasets.`,`<b>3.2</b>: dataset utility, to allocate and delete.`,`<b>=6</b>: TSO command line inside ISPF.`,`<b>PF3</b> leaves the panel, <b>PF7/PF8</b> scroll up and down.`,`<b>SUB</b> submits the JCL you are editing, <b>CANCEL</b> discards the changes.`,`<b>X</b> excludes lines, <b>F</b> finds, <b>C</b> changes: very common editor commands.`],
 ex:[{l:`TSO commands`,c:`# List your datasets
LISTCAT LEVEL(USER1)
# Information about a dataset
LISTDS 'USER1.TEST.DATA' MEMBERS
# Allocate a dataset
ALLOC DA('USER1.TEST.DATA') NEW CATALOG SPACE(5,5) TRACKS -
  RECFM(F B) LRECL(80) BLKSIZE(0)
# Delete a dataset
DELETE 'USER1.TEST.DATA'
# Status of your jobs
STATUS USER1`}]},
datasets:{t:`Datasets and the catalog`,
 lead:`In z/OS files are called <b>datasets</b>. The name is made of qualifiers separated by dots (44 characters in total at most, 8 per qualifier) and the <b>catalog</b> tells you which volume holds them.`,
 pts:[`<b>PS</b>: sequential, a flat file of records.`,`<b>PDS / PDSE</b>: library with <i>members</i>, like a folder of files. The PDSE is the modern version, with no need for compression.`,`<b>VSAM</b>: KSDS (by key), ESDS (by order), RRDS (by record number), LDS.`,`<b>GDG</b>: generation data group, numbered versions of the same dataset (<code>.G0001V00</code>).`,`<b>RECFM</b> and <b>LRECL</b> describe the record format: <code>FB 80</code> is the classic.`,`The first qualifier (<b>HLQ</b>) is usually the userid or the owning system.`],
 note:`<b>Warning:</b> with <code>DISP=(OLD,DELETE)</code> the dataset is really deleted. Double-check the name.`,
 ex:[{l:`Allocate with IEFBR14`,c:null},{l:`Delete a dataset`,c:null}]},
jcl:{t:`JCL: JOB, EXEC and DD`,
 lead:`The <b>Job Control Language</b> tells the system what to run and with which data. Every line starts with <code>//</code> and there are three main statements.`,
 pts:[`<b>JOB</b>: identifies the work, the class, the output class (<code>MSGCLASS</code>) and whom to notify.`,`<b>EXEC</b>: runs a program (<code>PGM=</code>) or a cataloged procedure (<code>PROC</code>).`,`<b>DD</b>: describes a dataset or a stream, linked to a name the program knows.`,`<code>DISP=(status,normal,abnormal)</code>: what to do with the dataset at the end of the step.`,`<code>COND</code> and <code>IF/THEN/ELSE</code> make step execution depend on the return code.`,`<code>//SYSIN DD *</code> places data or commands directly in the job, up to <code>/*</code>.`],
 note:`<b>Return code:</b> 0 = all good, 4 = warning, 8 = error, 12 = serious error, 16 = unrecoverable error.`,
 ex:[{l:`Multi-step job`,c:`//MULTI   JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X
//* STEP 1: copy
//COPY     EXEC PGM=IEBGENER
//SYSPRINT DD SYSOUT=*
//SYSIN    DD DUMMY
//SYSUT1   DD DSN=USER1.SOURCE,DISP=SHR
//SYSUT2   DD DSN=USER1.COPY,DISP=(NEW,CATLG,DELETE),
//         SPACE=(TRK,(5,5),RLSE),UNIT=SYSDA,
//         DCB=*.SYSUT1
//* STEP 2: only if step 1 went well
//         IF (COPY.RC = 0) THEN
//PRINT    EXEC PGM=IEBGENER
//SYSPRINT DD SYSOUT=*
//SYSIN    DD DUMMY
//SYSUT1   DD DSN=USER1.COPY,DISP=SHR
//SYSUT2   DD SYSOUT=*
//         ENDIF`}]},
utils:{t:`System utilities`,
 lead:`A system administrator uses a small group of service programs every day: copying, sorting, defining VSAM and managing libraries.`,
 pts:[`<b>IEFBR14</b>: does nothing, it just lets the DDs allocate or delete datasets.`,`<b>IEBGENER</b>: copies sequential datasets and can print.`,`<b>IEBCOPY</b>: copies, compresses and reloads partitioned libraries.`,`<b>IDCAMS</b>: the <i>Access Method Services</i> commands (DEFINE, REPRO, LISTCAT, DELETE).`,`<b>SORT</b> (DFSORT or SYNCSORT): sorts, merges, filters and reformats records.`,`<b>ADRDSSU</b>: backup, restore and movement of data at volume or dataset level.`],
 ex:[{c:null},{c:null},{c:null}]},
sdsf:{t:`SDSF: jobs and output`,
 lead:`<b>SDSF</b> is the tool to see queued, running or finished jobs, read their output and check the system log.`,
 pts:[`<b>ST</b> shows the status of all jobs; <b>DA</b> the active processes.`,`<b>LOG</b> opens the syslog; <b>H</b> shows held output.`,`Command line: <code>PREFIX USER1*</code> filters by job name and <code>OWNER USER1</code> by owner.`,`Type <b>S</b> next to a job to open its output, <b>?</b> to list its steps and files.`,`<b>P</b> purges the output, <b>C</b> cancels a running job.`,`Inside a job: <b>F</b> finds, <b>RFIND</b> repeats the search and <b>TOP</b>/<b>BOTTOM</b> jump to the ends.`],
 ex:[{l:`JES2 commands`,c:`# Active jobs
$DA
# Details of a job
$DJ(12345)
# Stop and restart job processing
$PJOBQ
$SJOBQ
# Release / hold a job
$AJ(12345)
$HJ(12345)
# Cancel a job
$CJ(12345)`}]},
racf:{t:`Security with RACF`,
 lead:`<b>RACF</b> (Resource Access Control Facility) decides who can access which resources. Equivalent products are ACF2 and Top Secret, but the concepts are the same.`,
 pts:[`<b>Users</b> and <b>groups</b> are the subjects; every user has a default group.`,`<b>Profiles</b> protect resources: datasets, transactions, commands and more, by <b>class</b> (DATASET, FACILITY, OPERCMDS…).`,`<b>UACC</b> is the universal access; <b>PERMIT</b> grants access to specific users or groups.`,`Access levels: NONE, READ, UPDATE, CONTROL, ALTER.`,`<b>Generic profiles</b> with <code>**</code> protect many datasets with a single profile.`,`After changing classes held in RACLIST you need <code>SETROPTS RACLIST(class) REFRESH</code>.`],
 note:`<b>Good practice:</b> use unique temporary passwords: those set by an administrator are flagged as expired, so the user picks their own at first logon (<code>NOEXPIRED</code> avoids this behavior).`,
 ex:[{l:`RACF`,c:`# Create a user
ADDUSER USER2 NAME('MARIO ROSSI') DFLTGRP(DEVEL) PASSWORD(Temp1234) TSO(ACCTNUM(ACCT) PROC(IKJACCNT))
# Protect all datasets under a level
ADDSD 'USER1.**' UACC(NONE)
# Grant read access to a user
PERMIT 'USER1.**' CLASS(DATASET) ID(USER2) ACCESS(READ)
# Show user info and profile
LISTUSER USER2
LISTDSD DATASET('USER1.TEST.DATA') ALL
# Resume a revoked user and set a new password
ALTUSER USER2 RESUME PASSWORD(New12345)
# Apply the class changes in memory
SETROPTS RACLIST(FACILITY) REFRESH`}]},
console:{t:`Console and operator commands`,
 lead:`From the z/OS console you control the system, the devices and the started tasks. Commands are typed in SDSF (<code>/D A,L</code>) or on a real console.`,
 pts:[`<b>D</b> (DISPLAY) shows information without changing anything.`,`<b>V</b> (VARY) puts devices and other resources online/offline.`,`<b>S</b> (START), <b>P</b> (STOP), <b>C</b> (CANCEL) and <b>F</b> (MODIFY) govern started tasks.`,`<b>T</b> (SET) applies PARMLIB members without a restart, like <code>T SMF=00</code>.`,`<b>SETPROG</b> dynamically changes APF, LNKLST and LPA.`,`<b>K</b> manages the console itself.`],
 ex:[{l:`Operator`,c:`# Start, modify and stop a started task
S MYSERV
F MYSERV,STATUS
P MYSERV
# Bring a device online
V 0A00,ONLINE
# List the APF libraries
D PROG,APF
# Add an APF library on the fly
SETPROG APF,ADD,DSNAME=USER1.LOADLIB,SMS
# List the system symbols
D SYMBOLS
# Check the SMF configuration
D SMF,O`}]},
sms:{t:`Storage and DFSMS`,
 lead:`With <b>DFSMS</b> the system decides where to put data according to rules, instead of having volumes picked by hand. This is the <i>Storage Management Subsystem</i> (SMS).`,
 pts:[`<b>Data Class</b>: technical attributes, such as RECFM, LRECL and space.`,`<b>Storage Class</b>: required performance and availability.`,`<b>Management Class</b>: backup, migration and expiration.`,`<b>Storage Group</b>: set of volumes that hold the data.`,`<b>ACS routines</b> assign the classes to every new dataset based on the name, the job or the user.`,`<b>ISMF</b> is the ISPF panel to manage all this; <b>DFHSM</b> handles automatic migration and backup.`],
 ex:[{l:`HSM and SMS`,c:`# Migrate and recall a dataset
HMIGRATE 'USER1.TEST.DATA'
HRECALL 'USER1.TEST.DATA'
# Immediate backup
HBACKDS 'USER1.TEST.DATA'
# SMS status
D SMS
D SMS,STORGRP(ALL)
# Activate a new SMS configuration
SETSMS SCDS(SYS1.SMS.SCDS)`}]},
parmlib:{t:`PARMLIB, IPL and startup`,
 lead:`At startup (<b>IPL</b>) z/OS reads a series of configuration members from the <b>PARMLIB</b> concatenation. Knowing them is the basis for configuring the system.`,
 pts:[`<b>LOADxx</b>: where to find IEASYSxx, the nucleus and the master catalog.`,`<b>IEASYSxx</b>: main system parameters.`,`<b>PROGxx</b>: APF libraries, LNKLST and dynamic exits.`,`<b>SMFPRMxx</b>: what to record in SMF.`,`<b>BPXPRMxx</b>: file systems and USS (Unix System Services) parameters.`,`<b>COUPLExx</b>: Sysplex configuration.`,`<b>IEFSSNxx</b>: subsystems such as JES2 and DB2.`],
 note:`<b>Caution:</b> before changing a PARMLIB member, always keep a copy and use syntax checks (such as <code>T</code> with a test member) when available.`,
 ex:[{l:`LOADxx`,c:`# Simplified example of a LOADxx member
IEASYM  00
SYSPARM 00
PARMLIB USER.PARMLIB                  VOL001
PARMLIB SYS1.PARMLIB                  VOL001
NUCLEUS 1
# Check on the running system
D IPLINFO
D PARMLIB`}]},
rexx:{t:`REXX and EXEC`,
 lead:`<b>REXX</b> is the scripting language of z/OS: ideal to automate TSO, ISPF and repetitive job tasks. Scripts are stored in <b>EXEC</b> libraries (SYSEXEC or SYSPROC).`,
 pts:[`The first line must contain the comment <code>/* REXX */</code>.`,`<code>SAY</code> prints, <code>PULL</code>/<code>ARG</code> read, <code>PARSE</code> splits strings.`,`Commands in quotes go to the current environment (TSO, ISPEXEC, SDSF…).`,`<code>EXECIO</code> reads and writes datasets line by line.`,`<b>Stem variables</b> like <code>rec.1</code>, <code>rec.2</code> act as arrays; <code>rec.0</code> holds the count.`,`Run with <code>EXEC 'USER1.REXX(NAME)' EXEC</code> or simply <code>%NAME</code>.`],
 ex:[{l:`Read a dataset`,c:`/* REXX */
ARG dsn
"ALLOC F(MYDD) DA('"dsn"') SHR REUSE"
"EXECIO * DISKR MYDD (STEM rec. FINIS"
"FREE F(MYDD)"
DO i = 1 TO rec.0
  SAY RIGHT(i,4) rec.i
END
SAY 'Lines read:' rec.0
EXIT 0`},{l:`Run from JCL`,c:`//REXXJOB JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X
//STEP1    EXEC PGM=IKJEFT01,PARM='%READDS USER1.TEST.DATA'
//SYSEXEC  DD DSN=USER1.REXX,DISP=SHR
//SYSTSPRT DD SYSOUT=*
//SYSTSIN  DD DUMMY`}]},
diag:{t:`Diagnostics and abends`,
 lead:`When a job fails, the first step is to read the completion code and the messages in JESMSGLG, JESJCL and JESYSMSG. These are the most common abends.`,
 pts:[`<b>S0C7</b>: invalid numeric data in a field (data exception).`,`<b>S0C4</b>: memory access not allowed (protection exception).`,`<b>S806</b>: module not found in STEPLIB, JOBLIB or LNKLST.`,`<b>S222</b>: the job was cancelled by the operator. <b>S322</b>: CPU time exceeded.`,`<b>B37 / D37 / E37</b>: out of space on volume, primary or extents.`,`<b>S913</b>: RACF denies access to the resource. <b>S878</b>: insufficient virtual storage.`,`<b>JCL error</b>: the step does not start; read the <code>IEF...</code> message in JESMSGLG.`],
 note:`<b>Tools:</b> <b>SMF</b> records system activity, <b>RMF</b> monitors performance and <b>SDSF LOG</b> shows events in real time.`,
 ex:[{l:`Common fixes`,c:`//* Not enough space (B37/D37/E37): more space and extents
//         SPACE=(CYL,(50,20),RLSE),
//* Module not found (S806): add the library
//STEPLIB  DD DSN=USER1.LOADLIB,DISP=SHR
//* Dump for diagnosis after an S0C4
//SYSUDUMP DD SYSOUT=*
//* More memory and time for the step
//STEP1    EXEC PGM=MYPROG,REGION=0M,TIME=1440`}]}
},

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pick=x=>x==null?null:(typeof x==='string'?x:(x[lang]!=null?x[lang]:x.it));
const strip=h=>h.replace(/<[^>]+>/g,'');
function exCode(ex){return ex.c[lang]!=null?ex.c[lang]:ex.c.it}
function exLabel(ex){return typeof ex.l==='string'?ex.l:pick(ex.l)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1400)}
function hlParams(s){return esc(s).replace(/\b([A-Z][A-Z0-9]*)=/g,'<span class="a">$1</span>=')}
function hl(code,lg){
  return code.split('\n').map(l=>{
    if(lg==='jcl'){
      if(l.startsWith('//*')) return '<span class="c">'+esc(l)+'</span>';
      if(l==='/*') return '<span class="p">/*</span>';
      const m=l.match(/^\/\/(\S*)(\s+)(JOB|EXEC|DD|PROC|PEND|SET|IF|ENDIF|ELSE|OUTPUT|INCLUDE)(\s*)(.*)$/);
      if(m) return '<span class="p">//</span><span class="n">'+esc(m[1])+'</span>'+m[2]+'<span class="k">'+m[3]+'</span>'+m[4]+hlParams(m[5]);
      if(l.startsWith('//')) return '<span class="p">//</span>'+hlParams(l.slice(2));
      return esc(l).replace(/^(\s*)(DEFINE|SORT|INCLUDE|COPY|REPRO|DELETE)\b/,'$1<span class="k">$2</span>');
    }
    if(lg==='rexx'){
      const i=l.indexOf('/*');
      let a=i<0?l:l.slice(0,i),b=i<0?'':l.slice(i);
      a=esc(a).replace(/\b(DO|END|SAY|EXIT|ARG|IF|THEN|ELSE|PARSE|ADDRESS|TO|CALL|RIGHT)\b/g,'<span class="k">$1</span>');
      return a+(b?'<span class="c">'+esc(b)+'</span>':'');
    }
    if(l.startsWith('#')) return '<span class="c">'+esc(l)+'</span>';
    return esc(l).replace(/^(\s*)([$A-Z][A-Z0-9]*)/,'$1<span class="k">$2</span>');
  }).join('\n');
}

function secHTML(s,i){
  const u=U();
  const ei=tabSel[s.id]||0;

  let h=`<section class="card rv" id="s-${s.id}"><header><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${esc(pick(s.t))}</h2><button class="done ${done.has(s.id)?'on':''}" data-done="${s.id}">${done.has(s.id)?'✓ '+u.marked:u.mark}</button></header>`;

function glossHTML(){
  const u=U();
  const letters=[...new Set(G.map(g=>g[0]))];
  const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  abc.forEach(l=>{h+=`<button data-gl="${l}" class="${gLetter===l?'on':''}" ${letters.includes(l)?'':'disabled'}>${l}</button>`});

  return h+'</div></section>';
}

const B=store.get('builder',{job:'ALLOC',dsn:'&SYSUID..TEST.DATA',type:'PS',unit:'TRK',p:5,s:5,dir:10,recfm:'FB',lrecl:80});
function num(v,d,mx){v=parseInt(v,10);if(!(v>0))v=d;return Math.min(v,mx||99999)}
function genJCL(f){
  const job=(f.job||'ALLOC').toUpperCase().replace(/[^A-Z0-9#$@]/g,'').slice(0,8)||'ALLOC';
  const dsn=(f.dsn||'').toUpperCase().replace(/[^A-Z0-9#$@.&-]/g,'')||'&SYSUID..TEST.DATA';
  const p=num(f.p,5),s=num(f.s,5),d=num(f.dir,10);
  const sp=f.type==='PS'?`(${p},${s})`:`(${p},${s},${d})`;
  const lr=num(f.lrecl,80,32760);
  const params=[`DSN=${dsn}`,`DISP=(NEW,CATLG,DELETE)`,`UNIT=SYSDA`,`SPACE=(${f.unit},${sp},RLSE)`];
  if(f.type==='PDSE') params.push('DSNTYPE=LIBRARY');
  params.push(`DCB=(RECFM=${f.recfm},LRECL=${lr},BLKSIZE=0,DSORG=${f.type==='PS'?'PS':'PO'})`);
  const lines=[`//${job.padEnd(8)} JOB (ACCT),'FRANCISCO',CLASS=A,MSGCLASS=X,`,`//         NOTIFY=&SYSUID`,`//STEP1    EXEC PGM=IEFBR14`];
  params.forEach((x,i)=>lines.push((i===0?'//NEWDS    DD ':'//         ')+x+(i<params.length-1?',':'')));
  return lines.join('\n');
}

   <div class="row2"><label>${u.fRec}${sel('b_recfm',[['FB','FB'],['VB','VB'],['F','F'],['V','V']],B.recfm)}</label><label>${u.fLr}<input id="b_lrecl" type="number" min="1" value="${B.lrecl}"></label><label>${u.fDir}<input id="b_dir" type="number" min="1" value="${B.dir}"></label></div>
  </div><div><div class="code" style="border-radius:14px"><div class="cb"><span>JCL</span><button class="copy" data-copy="builder">${u.copy}</button></div><pre><code id="b_out"></code></pre></div>
  <div class="exp">${lang==='en'
   ?`<div><b>${u.expT}</b></div><div><code>DISP=(NEW,CATLG,DELETE)</code>: creates the dataset, catalogs it if the step ends well and deletes it if it fails.</div><div><code>SPACE=(TRK,(5,5),RLSE)</code>: 5 primary tracks, up to 5 secondary and release of unused space.</div><div><code>BLKSIZE=0</code>: the system picks the optimal block size.</div>`

   ?`<div><b>${u.expT}</b></div><div><code>DISP=(NEW,CATLG,DELETE)</code>: crea il dataset, lo cataloga se lo step finisce bene e lo elimina se va in errore.</div><div><code>SPACE=(TRK,(5,5),RLSE)</code>: 5 tracce primarie, fino a 5 secondarie e rilascio dello spazio inutilizzato.</div><div><code>BLKSIZE=0</code>: il sistema sceglie la dimensione ottimale del blocco.</div>`
   :`<div><b>${u.expT}</b></div><div><code>DISP=(NEW,CATLG,DELETE)</code>: crea el dataset, lo cataloga si el paso termina bien y lo elimina si falla.</div><div><code>SPACE=(TRK,(5,5),RLSE)</code>: 5 pistas primarias, hasta 5 secundarias y liberación del espacio no usado.</div><div><code>BLKSIZE=0</code>: el sistema elige el tamaño óptimo de bloque.</div>`}</div></div></div></section>`;
}

    if(args.length)return labSyntax('STATUS');
    return labOK('jobs.read','[LAB] JOBID     JOBNAME  STATUS    CC\n'+(lab.jobs.length?lab.jobs.map(j=>j.id.padEnd(10)+j.name.padEnd(9)+'OUTPUT    '+j.cc).join('\n'):LX('empty')));
  }
  if(cmd==='ISPF'){
    if(args.length)return labSyntax('ISPF');
    lab.mode='ispf';lab.panel='primary';return labOK('ispf.open',labISPFPanel());
  }
  if(cmd==='3.4'||cmd==='=3.4'||cmd==='D'||cmd==='DISPLAY')return labBad('wrongContext');
  return labBad('unknown');
}
function labISPFPanel(){return '[LAB] ISPF PRIMARY OPTION MENU\n\n3  Utilities\n6  TSO command (simplified)\nX  Exit\n\n'+LX('ispfInfo');}
function labExecISPF(tokens){
  const text=tokens.join(' '),cmd=tokens[0];
  if(cmd==='HELP')return labOK('help',labHelp());
  if(cmd==='TSO'){
    if(tokens.length===1)return labSyntax('TSO PROFILE');
    const result=labExecTSO(tokens.slice(1));
    if(result.op==='logoff')lab.mode='tso';return result;
  }
  if(['END','F3','X','=X'].includes(text)){
    if(lab.panel!=='primary'&&text!=='X'&&text!=='=X'){lab.panel='primary';return labOK('ispf.back',labISPFPanel());}
    lab.mode='tso';lab.panel='primary';return labOK('ispf.exit','[LAB] ISPF → TSO\nREADY');
  }
  if(text==='3.4'||text==='=3.4'||text==='4'&&lab.panel==='utilities'){
    lab.panel='dslist';return labOK('dslist.open','[LAB] DATA SET LIST UTILITY — 3.4\nInclude Additional Qualifiers: YES (LAB)\n\n'+LX('ispfLevel'));
  }
  if(text==='3'){lab.panel='utilities';return labOK('ispf.utilities','[LAB] UTILITIES\n4  Data Set List\nEND  Back');}
  if(text==='6'){lab.mode='tso';return labOK('ispf.tso','[LAB] '+LX('envChange')+'\nREADY');}
  if(lab.panel==='dslist'&&tokens.length===1&&/^[A-Z#$@][A-Z0-9#$@.*-]*$/.test(text)){
    if(text.length>44)return labBad('invalidDsn',text);
    const safe=text.replace(/[.+?^${}()|[\]\\]/g,'\\$&').replace(/\*\*/g,'\u0000').replace(/\*/g,'[^.]*').replace(/\u0000/g,'.*');
    const re=new RegExp('^'+safe+'(?:\\..*)?$');
    const names=Object.keys(lab.datasets).filter(n=>re.test(n)).sort();
    return labOK('dslist.read','[LAB] DSLIST — '+text+'\n'+(names.length?names.map(n=>n.padEnd(30)+lab.datasets[n].org+'  '+lab.datasets[n].recfm+'  '+lab.datasets[n].lrecl).join('\n'):LX('empty')));
  }
  if(['PROFILE','LISTDS','LISTCAT','TIME','SUBMIT','D','DISPLAY'].includes(cmd))return labBad('wrongContext');
  return labBad('unknown');
}
function labExecMVS(tokens){
  if(tokens[0]==='HELP')return labOK('help',labHelp());
  if(!['D','DISPLAY'].includes(tokens[0])){
    if(['PROFILE','LISTDS','ISPF','LISTCAT','TIME','SUBMIT'].includes(tokens[0]))return labBad('wrongContext');
    return labBad('unknown');
  }
  const arg=tokens.slice(1).join('').replace(/\s/g,'');
  if(arg==='T')return labOK('mvs.time','[LAB] DISPLAY T\nLOCAL '+new Date().toLocaleString(lang)+'\nUTC   '+new Date().toISOString()+'\n'+LX('mvsNote'));
  if(arg==='A,L'||arg==='A,LIST'||arg==='JOBS,LIST')return labOK('mvs.activity','[LAB] DISPLAY A,L — DEMO\nNAME      TYPE     STATUS\nJES2      STC      ACTIVE\nVTAM      STC      ACTIVE\nTCPIP     STC      ACTIVE\nUSER1     TSU      ACTIVE\n\n'+LX('mvsNote'));
  if(arg==='TS,L'||arg==='TS,LIST')return labOK('mvs.users','[LAB] DISPLAY TS,L — DEMO\nUSER1     TSU      ACTIVE\n\n'+LX('mvsNote'));
  if(arg==='IPLINFO')return labOK('mvs.ipl','[LAB] DISPLAY IPLINFO — DEMO\nSYSTEM DEMO\nIPL DATE / TIME: NOT APPLICABLE\n\n'+LX('mvsNote'));
  if(arg==='U,DASD')return labOK('mvs.devices','[LAB] DISPLAY U,DASD — DEMO\nUNIT  TYPE  STATUS  VOLSER\n0A80  3390  ONLINE  DEMO01\n\n'+LX('mvsNote'));
  if(arg==='R,L')return labOK('mvs.requests','[LAB] DISPLAY R,L — DEMO\nNO OUTSTANDING REQUESTS\n\n'+LX('mvsNote'));
  return labBad('unsupported','DISPLAY '+arg);
}
function labDispatch(raw){
  if(raw.length>1500||/[\r\n]/.test(raw)||raw.startsWith('//'))return labBad('oneLine');
  let tokens;
  try{tokens=labTokens(raw.trim().toUpperCase().replace(/[‘’]/g,"'"));}catch(_){return labBad('badQuotes');}
  if(!tokens.length)return labSyntax('HELP');
  // Each mode has its own command namespace. Unknown commands never silently succeed.
  if(lab.mode==='mvs')return labExecMVS(tokens);
  if(lab.mode==='ispf')return labExecISPF(tokens);
  return labExecTSO(tokens);
}
function labMatches(id,r){
  if(!r.ok)return false;
  switch(id){
    case 'profile':return r.op==='profile.read';
    case 'catalog':return r.op==='catalog.read'&&r.level==='USER1';
    case 'attributes':return r.op==='dataset.read'&&r.dsn==='USER1.TEST.DATA';
    case 'members':return r.op==='members.read'&&r.dsn==='USER1.JCL';
    case 'allocate':return r.op==='allocate.new'&&r.dsn==='USER1.LAB.DATA'&&r.dd==='TRAIN'&&r.recfm==='FB'&&r.lrecl===80&&r.org==='PS'&&r.unit==='TRK';
    case 'allocations':return r.op==='allocations.read'&&r.status;
    case 'free':return r.op==='free'&&r.dd==='TRAIN'&&r.dsn==='USER1.LAB.DATA';
    case 'submit':return r.op==='submit'&&r.dsn==='USER1.JCL'&&r.member==='HELLO';
    case 'status':return r.op==='jobs.read';
    case 'ispf':return r.op==='ispf.open';
    case 'dslist':return r.op==='dslist.open';
    case 'activity':return r.op==='mvs.activity';
    default:return false;
  }
}
function labPrepare(index){
  const e=LAB_EXERCISES[index];
  lab.active=index;lab.mode=e.mode;lab.panel='primary';lab.logged=true;lab.prefix='USER1';lab.passed=false;lab.hint=false;lab.solution=false;lab.selected=null;lab.feedback='';
  // Reset only the specific demo scenario; the UI explicitly labels this preparation.
  const defaults=labSeed();['USER1.TEST.DATA','USER1.JCL'].forEach(n=>{if(!lab.datasets[n])lab.datasets[n]=defaults[n];});
  if(e.id==='allocate'){
    delete lab.datasets['USER1.LAB.DATA'];
    Object.keys(lab.dds).forEach(dd=>{if(dd==='TRAIN'||lab.dds[dd]==='USER1.LAB.DATA')delete lab.dds[dd];});
  }
  if(e.id==='allocations'||e.id==='free'){
    lab.datasets['USER1.LAB.DATA']={...defaults['USER1.TEST.DATA']};lab.dds.TRAIN='USER1.LAB.DATA';
  }
  if(e.id==='status'&&!lab.jobs.length)lab.jobs.push({id:'JOB'+String(lab.nextJob++).padStart(5,'0'),name:'HELLO',cc:'0000'});
  labLog('\n[LAB] '+String(index+1).padStart(2,'0')+' / '+LAB_EXERCISES.length+' — '+labPick(e.title),'info');
  labLog(LX('prepared'),'muted');
  if(e.mode==='ispf')labLog(labISPFPanel(),'info');
  labSave();
}
function labRun(raw,grade=true){
  raw=raw.trim();if(!raw)return;
  labLog(labPrompt()+' '+raw,'command');
  if(lab.history.at(-1)!==raw)lab.history.push(raw);lab.history=lab.history.slice(-80);labHistoryIndex=lab.history.length;labDraft='';
  // A failed guided attempt cannot log the learner out or damage the next retry.
  // Free practice intentionally retains its state-changing command behavior.
  const snapshot=lab.guided&&!lab.passed&&grade?JSON.parse(JSON.stringify({
    mode:lab.mode,panel:lab.panel,logged:lab.logged,prefix:lab.prefix,
    datasets:lab.datasets,dds:lab.dds,jobs:lab.jobs,nextJob:lab.nextJob
  })):null;
  let r;
  try{r=labDispatch(raw);}catch(error){console.error('Lab command error',error);r=labBad('unknown');}
  labLog(r.text,r.ok?'ok':'error');
  if(grade&&lab.guided&&!lab.passed&&(r.op!=='help'||lab.selected!==null)){
    const e=LAB_EXERCISES[lab.active];
    if(labMatches(e.id,r)){
      lab.passed=true;lab.feedback='pass';
      if(!lab.done.includes(e.id))lab.done.push(e.id);
      if(lab.solution&&!lab.assisted.includes(e.id))lab.assisted.push(e.id);
      labLog('[✓] '+LX('pass'),'success');
      if(window.mascotDance)window.mascotDance(1600);
    }else{
      if(snapshot){Object.assign(lab,snapshot);if(r.ok)labLog('[LAB] '+LX('rollback'),'muted');}
      lab.feedback=r.ok?'validOther':'errorRetry';
      if(window.mascotCryAt)window.mascotCryAt(document.getElementById('labInput'),LX(lab.feedback));
    }
  }else if(!r.ok&&window.mascotCryAt){window.mascotCryAt(document.getElementById('labInput'),LX('errorRetry'));}
  const input=document.getElementById('labInput');if(input)input.value='';
  labSave();labRefresh();
  if(input)input.focus({preventScroll:true});
  return r;
}

    labLog('[LAB] '+lab.mode.toUpperCase()+' — '+LX('envChange'),'info');

  }

      h+=`<div class="quiz-review-item ${right?'right':'wrong'}"><h4>${right?'✓':'×'} ${i+1}. ${esc(pick(q.q))}</h4><p>${esc(LX('qYours'))}: <b>${esc(options[a]||'—')}</b></p>${!right?`<p>${esc(LX('qCorrect'))}: <b>${esc(options[q.a])}</b></p>`:''}<div>${pick(q.e)}</div></div>`;
    });
    return h+'</details></div></section>';
  }
  const q=Q[quiz.i],checked=quiz.ans!==null,options=q.o[lang]||q.o.it;
  h+=`<div class="qhead"><span>${u.qn} ${quiz.i+1} ${u.of} ${Q.length}</span><span>★ ${quiz.score}</span></div><div class="bar" style="margin:0 0 20px"><i style="width:${100*(quiz.i+(checked?1:0))/Q.length}%"></i></div>`;
  h+=`<fieldset class="quiz-field"><legend>${esc(pick(q.q))}</legend><div class="quiz-choices">`;
  options.forEach((o,k)=>{
    const cl=checked?(k===q.a?'good':k===quiz.ans?'bad':''):k===quiz.selected?'selected':'';
    const mark=checked?(k===q.a?'✓':k===quiz.ans?'×':''):'';
    h+=`<label class="quiz-option ${cl}" for="quizChoice${k}"><input type="radio" id="quizChoice${k}" name="quiz-choice" value="${k}" ${quiz.selected===k?'checked':''} ${checked?'disabled':''}><b>${'ABCD'[k]}</b><span>${esc(o)}</span><strong>${mark}</strong></label>`;
  });
  h+='</div></fieldset>';
  if(checked){
    h+=`<div class="fb ${quiz.ans===q.a?'quiz-correct':'quiz-wrong'}" role="status" tabindex="-1"><b>${quiz.ans===q.a?u.ok:u.ko}</b><p>${esc(LX('qCorrect'))}: <strong>${esc(options[q.a])}</strong></p><div>${pick(q.e)}</div></div><div class="quiz-actions"><button class="btn pri" data-q="next">${quiz.i===Q.length-1?u.fin:u.next} →</button><small>${esc(LX('qConfirmed'))}</small></div>`;
  }else{
    h+=`<div class="quiz-actions"><button class="btn pri" data-q="verify" ${quiz.selected===null?'disabled':''}>${esc(LX('qVerify'))}</button><small id="quizSelectionStatus" role="status">${esc(LX(quiz.selected===null?'qSelect':'qSelected'))}</small></div>`;
  }
  return h+'</div></section>';
}
function quizAction(action){
  if(action==='reset'){quiz={i:0,score:0,ans:null,selected:null,answers:[],fin:false};replaceQuiz();return;}
  if(quiz.fin)return;
  if(action==='verify'){
    if(quiz.ans!==null||quiz.selected===null)return;
    quiz.ans=quiz.selected;quiz.answers[quiz.i]=quiz.ans;
    const correct=quiz.ans===Q[quiz.i].a;if(correct)quiz.score++;
    replaceQuiz();
    if(correct){if(window.mascotDance)window.mascotDance(1900);if(typeof say==='function')say(mm().good[0],{ms:3000,anim:'cheer'});}
    else if(window.mascotCryAt)window.mascotCryAt(document.querySelector('#s-quiz .fb'),LX('qCorrect')+': '+esc((Q[quiz.i].o[lang]||Q[quiz.i].o.it)[Q[quiz.i].a]));
    document.querySelector('#s-quiz .fb')?.focus({preventScroll:true});
  }else if(action==='next'){
    if(quiz.ans===null)return;
    if(quiz.i===Q.length-1){quiz.fin=true;if(best==null||quiz.score>best){best=quiz.score;store.set('best',best);}}
    else{quiz.i++;quiz.ans=null;quiz.selected=null;}
    replaceQuiz();
    const target=document.querySelector('#s-quiz legend, #s-quiz .score');if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});}
  }
}

function observe(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.06});
  document.querySelectorAll('.card.rv').forEach(c=>io.observe(c));
  const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
    const id=e.target.id.replace('s-','');
    document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('act',a.dataset.id===id));

}

let sel=-1,hits=[];
function buildIndex(){
  const idx=[{id:'lab',tag:'>_',title:LX('title'),text:LX('lead')+' TSO ISPF MVS console consola terminale comandos comandi simulatore exercises'},{id:'quiz',tag:'?',title:U().quizT,text:LX('qLead')}];
  S.forEach((s,i)=>{
    const code=s.ex.map(exCode).join('\n');
    idx.push({id:s.id,tag:String(i+1).padStart(2,'0'),title:pick(s.t),text:strip(pick(s.lead)+' '+s.pts[lang].map(strip).join(' ')+' '+code+(s.note?' '+strip(pick(s.note)):''))});
  });
  G.forEach(g=>idx.push({id:'gloss',g:g[1],tag:g[0],title:g[1],text:pick(g[2])}));
  return idx;
}
function runSearch(){
  const q=$('#q').value.trim();const box=$('#res');
  if(q.length<2){box.classList.remove('on');hits=[];return}
  const words=q.toLowerCase().split(/\s+/);
  hits=buildIndex().map(it=>{
    const T=it.title.toLowerCase(),X=it.text.toLowerCase();
    let sc=0;for(const w of words){if(T.includes(w))sc+=10;if(X.includes(w))sc+=1;else if(!T.includes(w))return null}
    return {...it,sc}
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,8);
  sel=-1;
  if(!hits.length){box.innerHTML=`<button disabled><small>${U().none}</small></button>`;box.classList.add('on');return}
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');
  box.innerHTML=hits.map((h,i)=>{
    const lo=h.text.toLowerCase();const p=Math.max(0,lo.indexOf(words[0])-40);
    const sn=esc(h.text.slice(p,p+120).replace(/\s+/g,' ')).replace(re,'<mark>$1</mark>');
    return `<button data-go="${h.id}" data-g="${h.g||''}" data-i="${i}"><b><span class="tag">${esc(h.tag)}</span>${esc(h.title)}</b><small>${p>0?'…':''}${sn}…</small></button>`;
  }).join('');
  box.classList.add('on');
}
function goTo(id,term){
  $('#res').classList.remove('on');$('#q').blur();
  if(id==='gloss'&&term){
    const g=G.find(x=>x[1]===term);gLetter=g[0];replaceGloss();
    setTimeout(()=>{const el=document.getElementById('g-'+term);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash')}},60);
  }else{const el=document.getElementById('s-'+id);if(el)el.scrollIntoView({behavior:'smooth'})}
}
$('#q').addEventListener('input',runSearch);
$('#q').addEventListener('keydown',e=>{
  const btns=[...document.querySelectorAll('#res button[data-go]')];
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(btns.length-1,sel+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1)}
  else if(e.key==='Enter'&&btns.length){const b=btns[Math.max(0,sel)];goTo(b.dataset.go,b.dataset.g);return}
  else if(e.key==='Escape'){$('#res').classList.remove('on');$('#q').blur();return}
  else return;
  btns.forEach((b,i)=>b.classList.toggle('sel',i===sel));
  if(btns[sel])btns[sel].scrollIntoView({block:'nearest'});
});
