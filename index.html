  else if(a==='go'){goTo(t.dataset.go,t.dataset.g);if(matchMedia('(max-width:560px)').matches){chat.open=false;chatRender()}}
  else if(a==='human'){
    const c=cs(),txt=encodeURIComponent(c.hGreet);
    if(CONFIG.whatsapp)window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+txt,'_blank','noopener');
    else if(CONFIG.email)location.href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent(c.hSub)+'&body='+txt;
    else{chat.tab='req';chat.status=null;chatRender()}
  }
});

});

const mas={tt:null,bt:null,st:null,cur:null,sticky:false,tour:-1,shown:new Set(),muted:store.get('masMuted',false),asleep:false};
const mm=()=>MS[lang];
const MTOUR=['.search','#langSeg','#s-intro','#s-builder','#s-gloss','#s-quiz','#chatFab'];
const mEl=()=>$('#mascot');

function curSec(){
  const mid=innerHeight*.45;
  for(const el of document.querySelectorAll('main section.card')){const r=el.getBoundingClientRect();if(r.top<=mid&&r.bottom>=mid)return el.id.replace('s-','')}
  return null;
}
function anim(c,t){const m=mEl();m.classList.add(c);setTimeout(()=>m.classList.remove(c),t||1000)}
function hideBubble(){clearTimeout(mas.bt);mas.sticky=false;$('#masBubble').classList.remove('on')}
function say(html,o){
  o=o||{};const b=$('#masBubble');clearTimeout(mas.bt);
  b.innerHTML=html;b.classList.add('on');mas.sticky=!!o.sticky;
  if(!o.sticky)mas.bt=setTimeout(hideBubble,o.ms||7000);
  if(o.anim)anim(o.anim,o.animMs);
}
function confetti(n){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const r=$('#masBody').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+18;
  const cols=['#4589ff','#42be65','#f1c21b','#ee5396','#8a3ffc'];
  for(let i=0;i<n;i++){
    const d=document.createElement('i');
    d.style.cssText='position:fixed;left:'+cx+'px;top:'+cy+'px;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:120;background:'+cols[i%5];
    document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=70+Math.random()*170;
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*v+'px,'+(Math.sin(a)*v-90)+'px) rotate('+Math.random()*720+'deg)',opacity:0}],{duration:900+Math.random()*700,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove();
  }
}
function menu(){
  const m=mm();
  say(`<b>${m.menuT}</b><div class="mb">
   <button data-m="here" class="pri">${m.bHere}</button>
   <button data-m="tour">${m.bTour}</button>
   <button data-m="tip">${m.bTip}</button>
   <button data-m="quiz">${m.bQuiz}</button>
   <button data-m="search">${m.bSearch}</button>
   <button data-m="chat">${m.bChat}</button>
   <button data-m="mute">${mas.muted?m.bUnmute:m.bMute}</button></div>
   <form class="mask" id="masAsk"><input id="masQ" placeholder="${m.askPh}" autocomplete="off"><button type="submit">${m.askGo}</button></form><div id="masRes"></div>`,{sticky:true,anim:'wave',animMs:2400});
}
function here(){
  const m=mm(),id=curSec(),s=S.find(x=>x.id===id);
  if(id==='lab'){say(esc(LX('lead')),{ms:7000,anim:'hop'});return}
  if(!id){say(m.noSec,{ms:7000,anim:'hop'});return}
  let h=`<div>${m.sec[id]||m.here}</div><div class="mb">`;
  if(s||id==='builder')h+=`<button data-m="copy">${m.copyEx}</button>`;
  if(s&&!done.has(id))h+=`<button data-m="done">${m.markDone}</button>`;
  h+='</div>';
  say(h,{sticky:true,anim:'hop'});
}
function copyHere(){
  const m=mm(),id=curSec(),s=S.find(x=>x.id===id);
  let txt=null;
  if(s)txt=exCode(s.ex[tabSel[s.id]||0]);else if(id==='builder')txt=genJCL(B);
  if(!txt){say(m.noCopy,{ms:5000,anim:'sad'});return}
  copyText(txt).then(()=>{say(m.copied,{ms:3500,anim:'cheer',animMs:1600});toast(U().copied)});
}
function celebrateDone(){
  const m=mm(),n=done.size,t=S.length;
  if(n>=t){say(m.doneAll,{ms:8000,anim:'cheer',animMs:2200});confetti(46)}
  else{say(m.doneOne.replace('{n}',n).replace('{t}',t),{ms:5000,anim:'cheer',animMs:1600});confetti(14)}
}
function markHere(){
  const id=curSec(),s=S.find(x=>x.id===id);if(!s)return;
  done.add(id);store.set('done',[...done]);rerenderSec(id);renderSide();celebrateDone();
}
function askZed(q){
  const m=mm(),hits=chatSearch(q);let h;
  if(hits.length)h=`<div style="margin-top:8px">${m.found}</div><div class="mb">`+hits.map(x=>`<button data-ch="go" data-go="${x.id}" data-g="${esc(x.g||'')}">${esc(x.title)}</button>`).join('')+'</div>';
  else h=`<div style="margin-top:8px">${m.none}</div><div class="mb"><button data-ch="reqfrom" data-q="${esc(q)}">${CH[lang].reqBtn}</button></div>`;
  $('#masRes').innerHTML=h;
}
function tourStep(i){
  document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
  if(i>=MTOUR.length){endTour(true);return}
  mas.tour=i;const el=document.querySelector(MTOUR[i]),m=mm();
  if(el){el.classList.add('tour-hl');el.scrollIntoView({behavior:'smooth',block:(i<2||i===6)?'nearest':'center'})}
  say(`<small>${i+1}/${MTOUR.length}</small><div>${m.steps[i]}</div><div class="mb" style="grid-template-columns:1fr 1fr"><button data-m="skip">${m.skip}</button><button data-m="next" class="pri">${i===MTOUR.length-1?m.finish:m.next}</button></div>`,{sticky:true,anim:'hop'});
}
function endTour(fin){
  document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
  mas.tour=-1;
  if(fin)say(mm().tourEnd,{ms:6000,anim:'cheer',animMs:1600});else hideBubble();
}
function wakeUp(){
  clearTimeout(mas.st);
  if(mas.asleep){mas.asleep=false;mEl().classList.remove('sleep');say(mm().wake,{ms:3500,anim:'wave',animMs:1500})}
  mas.st=setTimeout(()=>{mas.asleep=true;mEl().classList.add('sleep');hideBubble()},60000);
}

document.addEventListener('click',e=>{
  if(e.target.closest('#masBody')){
    if($('#masBubble').classList.contains('on')&&mas.sticky&&mas.tour<0){hideBubble();return}
    menu();return;
  }
  const t=e.target.closest('[data-m]');
  if(t){
    const a=t.dataset.m,m=mm();
    if(a==='here')here();
    else if(a==='tour')tourStep(0);
    else if(a==='next')tourStep(mas.tour+1);
    else if(a==='skip')endTour(false);
    else if(a==='tip')say(m.tips[Math.floor(Math.random()*m.tips.length)],{ms:7000,anim:'hop'});
    else if(a==='quiz'){const el=$('#s-quiz');if(el)el.scrollIntoView({behavior:'smooth'});say(m.sec.quiz,{ms:5000,anim:'hop'})}
    else if(a==='search'){hideBubble();const q=$('#q');q.focus();q.select()}
    else if(a==='chat'){hideBubble();chat.open=true;chat.tab='chat';chatRender()}
    else if(a==='mute'){mas.muted=!mas.muted;store.set('masMuted',mas.muted);menu()}
    else if(a==='copy')copyHere();
    else if(a==='done')markHere();
    return;
  }
  const dn=e.target.closest('[data-done]');
  if(dn){const id=dn.dataset.done;setTimeout(()=>{if(done.has(id))celebrateDone()},0);return}
  const cp=e.target.closest('[data-copy]');
  if(cp&&!cp.closest('#masBubble')){setTimeout(()=>{say(mm().copied,{ms:2600,anim:'hop'})},0);return}
  if(!e.target.closest('#mascot')&&mas.sticky&&mas.tour<0)hideBubble();
});
document.addEventListener('click',e=>{if(e.target.closest('#masBubble [data-ch]'))setTimeout(hideBubble,150)});
document.addEventListener('submit',e=>{if(e.target.id==='masAsk'){e.preventDefault();const q=$('#masQ').value.trim();if(q)askZed(q)}});
document.addEventListener('pointermove',e=>{
  const r=$('#masBody').getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width*.5),dy=e.clientY-(r.top+r.height*.2);
  const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/160)*2.6;
  const tr='translate('+(dx/d*k).toFixed(2)+'px,'+(dy/d*k).toFixed(2)+'px)';
  $('#pupL').style.transform=tr;$('#pupR').style.transform=tr;
  if(mas.asleep)wakeUp();
},{passive:true});
let scrollTick=false;
window.addEventListener('scroll',()=>{
  if(mas.asleep)wakeUp();
  if(scrollTick)return;scrollTick=true;
  setTimeout(()=>{
    scrollTick=false;
    const id=curSec();
    if(id===mas.cur)return;
    mas.cur=id;clearTimeout(mas.tt);
    if(id&&!mas.muted&&!mas.shown.has(id)&&!mas.sticky&&mas.tour<0){
      mas.tt=setTimeout(()=>{
        if(curSec()===id&&!mas.sticky&&!chat.open&&mas.tour<0&&mm().sec[id]){mas.shown.add(id);say(mm().sec[id],{ms:7000,anim:'hop'})}
      },1600);
    }
  },250);
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(mas.tour>=0)endTour(false);else if(mas.sticky)hideBubble()}
  wakeUpKey();
});
function wakeUpKey(){if(mas.asleep)wakeUp()}
setInterval(()=>{if(mas.asleep)return;const m=mEl();m.classList.add('blink');setTimeout(()=>m.classList.remove('blink'),140)},3600);

const _chatRender=window.chatRender;
window.chatRender=function(){_chatRender();mEl().classList.toggle('hide',!!chat.open)};
window.mascotRefresh=function(){
  $('#masBody').setAttribute('aria-label',mm().label);
  $('#masBody').title=mm().label;
  mEl().classList.toggle('hide',!!chat.open);
  if(mas.tour>=0)endTour(false);else hideBubble();
};

renderAll();
(function(){
  const seen=store.get('masSeen',false);
  setTimeout(()=>{
    const m=mm();
    if(!seen){
      say(m.hello+`<div class="mb"><button data-m="tour" class="pri">${m.bTour}</button><button data-m="tip">${m.bTip}</button></div>`,{ms:12000,anim:'wave',animMs:2400});
      store.set('masSeen',true);
    }else say(m.back,{ms:4500,anim:'wave',animMs:1500});
  },1800);
  wakeUp();
})();
</script>

function renderAccount(wantsChat=false){
 const body=$('cloudBody');
 if(!configValid){body.innerHTML=`<h3>${esc(t('setup'))}</h3><div class="cloud-message">${esc(t(configMissing?'setupText':'configKey'))}</div><p>${esc(t('fileNote'))}</p><div class="cloud-actions"><button class="btn" data-cloud="export">${esc(t('export'))}</button><button class="btn" data-cloud="guide">${esc(t('guide'))}</button></div><div id="cloudNotice" hidden></div>`;return;}
 if(loading){body.innerHTML=`<h3>${esc(t('loading'))}</h3><p>${esc(t('intro'))}</p>`;return;}
 if(!user){
  const signup=authMode==='signup',reset=authMode==='reset';
  body.innerHTML=`<h3>${esc(t(wantsChat?'loginChat':signup?'signup':reset?'reset':'login'))}</h3><p>${esc(t('intro'))}</p><form class="cloud-form" id="cloudAuthForm">
  ${signup?`<label>${esc(t('name'))}<input name="name" minlength="2" maxlength="40" required autocomplete="nickname"></label>`:''}
  <label>${esc(t('email'))}<input name="email" type="email" required autocomplete="email" maxlength="254"></label>
  ${!reset?`<label>${esc(t('password'))}<input name="password" type="password" ${signup?'minlength="12"':''} required autocomplete="${signup?'new-password':'current-password'}" maxlength="256"></label>`:''}
  <button class="btn pri" type="submit">${esc(t(signup?'signup':reset?'sendReset':'login'))}</button></form>
  <div class="cloud-actions"><button class="btn" data-cloud="auth-login">${esc(t('login'))}</button>${C.allowRegistration!==false?`<button class="btn" data-cloud="auth-signup">${esc(t('signup'))}</button>`:''}<button class="btn" data-cloud="auth-reset">${esc(t('reset'))}</button></div><div id="cloudNotice" class="cloud-message" role="status" hidden></div><p style="margin-top:18px">${esc(t('authPrivacy'))}</p>`;return;
 }
 const conflictHTML=Array.from(conflicts.entries()).map(([key])=>`<div class="cloud-card"><h4>${esc(key)}</h4><p>${esc(t('conflictText'))}</p><div class="cloud-actions"><button class="btn" data-cloud="remote" data-key="${esc(key)}">${esc(t('remoteChoice'))}</button><button class="btn pri" data-cloud="local" data-key="${esc(key)}">${esc(t('localChoice'))}</button></div></div>`).join('');
 body.innerHTML=`<h3>${esc(profileName||t('account'))}</h3><p>${esc(user.email||'')}</p><div class="cloud-message" id="cloudSyncStatus" role="status"></div>${conflictHTML}
 ${recovery?`<form class="cloud-form" id="cloudPasswordForm"><label>${esc(t('newPassword'))}<input name="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><button class="btn pri">${esc(t('updatePassword'))}</button></form>`:''}
 <div class="cloud-card"><h4>${esc(t('privateData'))}</h4><p>${esc(t('privateText'))}</p><div class="cloud-actions"><button class="btn pri" data-cloud="refresh">${esc(t('refresh'))}</button><button class="btn" data-cloud="room">${esc(t('room'))}</button><button class="btn" data-cloud="export">${esc(t('export'))}</button><button class="btn" data-cloud="import">${esc(t('import'))}</button><button class="btn" data-cloud="legacy">${esc(t('legacy'))}</button></div></div>
 <form id="cloudNameForm" class="cloud-form"><label>${esc(t('name'))}<input name="name" value="${esc(profileName)}" minlength="2" maxlength="40" required autocomplete="nickname"></label><small>${esc(t('nameHelp'))}</small><button class="btn">${esc(t('saveName'))}</button></form>
 <div id="cloudNotice" class="cloud-message" role="status" hidden></div><div class="cloud-actions"><button class="btn" data-cloud="logout">${esc(t('logout'))}</button></div>`;
}
function renderRoom(){
 $('cloudBody').innerHTML=`<div class="cloud-room"><div class="cloud-room-note">${esc(t('memberNote'))}<br><span id="cloudLive" class="cloud-live"></span></div><button class="btn" data-cloud="older">${esc(t('older'))}</button><div id="cloudMessages" class="cloud-messages" aria-label="${esc(t('room'))}"></div><form class="cloud-form cloud-compose" id="cloudMessageForm"><textarea name="message" id="cloudMessageInput" rows="2" maxlength="2000" placeholder="${esc(t('messagePh'))}" aria-label="${esc(t('messagePh'))}" required></textarea><button class="btn pri" type="submit">${esc(t('send'))}</button></form><div id="cloudNotice" class="cloud-message" role="status" hidden></div><div class="cloud-room-note">${esc(t('noAI'))}</div></div>`;
 $('cloudMessageInput').value=chatDraft;drawMessages(true);loadMessages();
}
function drawMessages(scroll=false){
 const list=$('cloudMessages');if(!list)return;
 const bottom=list.scrollHeight-list.scrollTop-list.clientHeight<80;
 const frag=document.createDocumentFragment();
 if(!messages.length){const p=document.createElement('div');p.className='cloud-empty';p.textContent=t(messagesLoaded?'empty':'loadingMessages');frag.append(p);}
 for(const msg of messages){
  const el=document.createElement('article');el.className='cloud-bubble'+(msg.user_id===user?.id?' own':'');
  const h=document.createElement('header'),name=document.createElement('strong'),time=document.createElement('time');
  name.textContent=msg.display_name+' · '+String(msg.user_id).slice(0,6);time.dateTime=msg.created_at;time.textContent=new Date(msg.created_at).toLocaleString(L(),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});h.append(name,time);
  if(msg.user_id===user?.id){const del=document.createElement('button');del.type='button';del.textContent=t('delete');del.dataset.cloud='delete';del.dataset.id=String(msg.id);h.append(del);}
  const text=document.createElement('div');text.className='body';text.textContent=msg.body;el.append(h,text);frag.append(el);
 }
 const oldTop=list.scrollTop;list.replaceChildren(frag);list.scrollTop=scroll||bottom?list.scrollHeight:oldTop;
}
let messageLoading=false;
async function loadMessages(older=false){
 if(!client||!user||!ready||messageLoading)return;messageLoading=true;const stamp=epoch;
 try {
  let q=client.from('zos_messages').select('id,user_id,display_name,body,created_at').order('id',{ascending:false}).limit(50);
  if(older&&messages.length)q=q.lt('id',messages[0].id);
  const {data,error}=await q;if(error)throw error;if(stamp!==epoch)return;
  const map=new Map(messages.map(m=>[String(m.id),m]));for(const m of data||[])map.set(String(m.id),m);
  messages=Array.from(map.values()).sort((a,b)=>Number(a.id)-Number(b.id)).slice(-1000);messagesLoaded=true;drawMessages();
 }catch{if(stamp===epoch)note(t('fetchFailed'),'error');}finally{messageLoading=false;}
}
function setBusy(v){loading=v;document.getElementById('main').inert=v;document.getElementById('side').inert=v;updateStatus();}
function hydrate(){store.quiet(()=>window.ZOSApp?.hydrate());updateStatus();}
async function handleSession(session,force=false){
 const next=session?.user||null;
 if(!force&&user?.id===next?.id&&(ready||loading))return;
 if(!next&&!user&&!force){updateStatus();return;}
 const stamp=++epoch;clearTimeout(timer);clearTimeout(retryTimer);if(channel){client.removeChannel(channel);channel=null;}
 user=next;ready=false;pending.clear();conflicts.clear();versions.clear();messages=[];messagesLoaded=false;chatDraft='';realtime=false;lastSaved=null;lastError='';profileName='';
 const ui={lang:store.get('lang',L()),theme:store.get('theme','dark')};store.replace(ui);hydrate();
 if(!user){setBusy(false);if(dialog.open)render();return;}
 setBusy(true);if(dialog.open)render();
 try{
  const {data,error}=await client.from('zos_user_state').select('key,value,version,updated_at').eq('user_id',user.id);
  if(error)throw error;if(stamp!==epoch)return;
  const values={...ui};for(const row of data||[]){if(store.keys.includes(row.key)){values[row.key]=row.value;versions.set(row.key,Number(row.version));if(!lastSaved||row.updated_at>lastSaved)lastSaved=row.updated_at;}}
  store.replace(values);hydrate();ready=true;
  const result=await client.from('zos_profiles').select('display_name').eq('user_id',user.id).maybeSingle();
  if(stamp!==epoch)return;
  profileName=result.data?.display_name||String(user.user_metadata?.display_name||('Studente-'+user.id.slice(0,6))).slice(0,40);
  channel=client.channel('zos-room-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'zos_messages'},payload=>{
   if(payload.eventType==='DELETE'&&payload.old?.id){messages=messages.filter(m=>String(m.id)!==String(payload.old.id));drawMessages();}
   else loadMessages();
  }).subscribe(s=>{realtime=s==='SUBSCRIBED';updateStatus();if(realtime)loadMessages();});
 }catch{if(stamp===epoch){lastError='dbFailed';ready=false;}}
 finally{if(stamp===epoch){setBusy(false);if(dialog.open)render();updateStatus();}}
}
function queue(key,value){if(!user||!ready)return;pending.set(key,{value:clone(value),serial:++serial});lastError='';clearTimeout(timer);timer=setTimeout(flush,600);updateStatus();}
window.addEventListener('zos:change',e=>queue(e.detail.key,e.detail.value));
async function flush(){
 if(flushTask)return flushTask;
 if(!client||!user||!ready||!pending.size)return;
 if(!navigator.onLine){lastError='offline';updateStatus();return;}
 const stamp=epoch;
 flushTask=(async()=>{
  try{
   for(const [key,item] of Array.from(pending.entries())){
    if(stamp!==epoch)return;if(conflicts.has(key))continue;
    const {data,error}=await client.rpc('zos_save_state',{p_key:key,p_value:item.value,p_expected_version:versions.get(key)||0});
    if(stamp!==epoch)return;if(error)throw error;
    const res=Array.isArray(data)?data[0]:data;if(!res)throw Error('empty response');
    if(!res.saved){conflicts.set(key,{version:Number(res.version),value:res.value});if(dialog.open&&tab==='account')render();continue;}
    versions.set(key,Number(res.version));lastSaved=res.updated_at;lastError='';
    if(pending.get(key)?.serial===item.serial)pending.delete(key);
   }
  }catch{if(stamp===epoch){lastError='dbFailed';clearTimeout(retryTimer);retryTimer=setTimeout(flush,30000);}}
 })();
 updateStatus();try{await flushTask;}finally{flushTask=null;updateStatus();if(!lastError&&pending.size>conflicts.size){clearTimeout(timer);timer=setTimeout(flush,600);}}
}
function resolveConflict(key,local){
 const conflict=conflicts.get(key);if(!conflict)return;versions.set(key,conflict.version);conflicts.delete(key);
 if(!local){pending.delete(key);store.quiet(()=>store.set(key,conflict.value));hydrate();}
 render();if(local)flush();
}
async function refresh(){await flush();if(pending.size){note(t('noSaveExit'),'error');return;}if(user)await handleSession({user},true);}
function exportData(){
 const payload={format:'zos-cloud-progress',version:1,exportedAt:new Date().toISOString(),data:window.ZOSApp.snapshot()};
 const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='zos-progressi.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function importData(obj){
 if(!user||!ready){note(t('importAccount'),'error');return;}
 const raw=obj?.format==='zos-cloud-progress'?obj.data:obj;
 if(!raw||typeof raw!=='object'||Array.isArray(raw)){note(t('badFile'),'error');return;}
 const data={};try{for(const key of store.keys)if(Object.hasOwn(raw,key))data[key]=window.ZOSApp.clean(key,raw[key]);}catch{note(t('badFile'),'error');return;}
 if(!Object.keys(data).length){note(t('badFile'),'error');return;}
 if(!confirm(t('importConfirm')))return;
 store.quiet(()=>{for(const [k,v]of Object.entries(data))store.set(k,v);});hydrate();for(const [k,v]of Object.entries(data))queue(k,v);note(t('imported'));await flush();
}
function uuid(){return crypto.randomUUID();}
async function sendMessage(form){
 if(!user||!ready){note(t('noAuth'),'error');return;}
 const input=form.elements.message,body=input.value.trim();if(!body||body.length>2000)return;
 if(clientDraft!==body||!clientId){clientId=uuid();clientDraft=body;}
 const button=form.querySelector('button');button.disabled=true;
 try{
  const {data,error}=await client.rpc('zos_send_message',{p_body:body,p_client_id:clientId});if(error)throw error;
  const row=Array.isArray(data)?data[0]:data;if(!row)throw Error('missing confirmation');
  const map=new Map(messages.map(m=>[String(m.id),m]));map.set(String(row.id),row);messages=Array.from(map.values()).sort((a,b)=>Number(a.id)-Number(b.id));messagesLoaded=true;
  if(input.value.trim()===body){input.value='';chatDraft='';clientDraft='';clientId=null;}drawMessages(true);note(t('sent'),'ok');
 }catch(e){note(t(String(e.message).includes('rate_limited')?'rate':'notSent'),'error');}finally{button.disabled=false;}
}
async function authSubmit(form){
 if(!client){note(t('authFailed'),'error');return;}
 const mode=authMode,data=new FormData(form),email=String(data.get('email')||''),password=String(data.get('password')||'');
 const button=form.querySelector('button');button.disabled=true;note(t('signing'));
 const redirect=location.origin+location.pathname;
 try{
  let res;
  if(mode==='signup'){if(password.length<12)throw Error('weak');res=await client.auth.signUp({email,password,options:{emailRedirectTo:redirect,data:{display_name:String(data.get('name')||'').trim()}}});}
  else if(mode==='reset')res=await client.auth.resetPasswordForEmail(email,{redirectTo:redirect});
  else res=await client.auth.signInWithPassword({email,password});
  if(res.error)throw res.error;
  if(mode==='reset')note(t('resetSent'),'ok');else if(mode==='signup'&&!res.data?.session)note(t('checkMail'),'ok');
  else if(res.data?.session)await handleSession(res.data.session);
 }catch(e){note(t(e.message==='weak'?'minPassword':'authFailed'),'error');}finally{button.disabled=false;}
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-cloud],#chatFab');if(!b)return;e.preventDefault();e.stopImmediatePropagation();
 const action=b.id==='chatFab'?'room':b.dataset.cloud;
 if(action==='close'){dialog.close();return;}
 if(action==='account'||action==='room'){open(action);return;}
 if(action==='guide'){dialog.close();window.ZOSApp.openAssistant();return;}
 if(action.startsWith('auth-')){authMode=action.slice(5);render();return;}
 if(action==='export'){exportData();return;}
 if(action==='refresh'||action==='retry'){await refresh();return;}
 if(action==='older'){loadMessages(true);return;}
 if(action==='remote'||action==='local'){resolveConflict(b.dataset.key,action==='local');return;}
 if(action==='legacy'){const old=store.legacy();if(!Object.keys(old).length)note(t('noLegacy'));else importData(old);return;}
 if(action==='import'){
  if(!user||!ready){note(t('importAccount'),'error');return;}
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.addEventListener('change',async()=>{const f=input.files[0];if(!f)return;if(f.size>2000000){note(t('badFile'),'error');return;}try{await importData(JSON.parse(await f.text()));}catch{note(t('badFile'),'error');}});input.click();return;
 }
 if(action==='delete'&&confirm(t('deleteConfirm'))){
  const {data,error}=await client.rpc('zos_delete_message',{p_id:b.dataset.id});if(error||!data){note(t('authFailed'),'error');return;}
  messages=messages.filter(m=>String(m.id)!==b.dataset.id);drawMessages();return;
 }
 if(action==='logout'){
  await flush();if(pending.size){note(t('noSaveExit'),'error');return;}
  const {error}=await client.auth.signOut();if(error)note(t('authFailed'),'error');else {recovery=false;await handleSession(null,true);}return;
 }
},true);
document.addEventListener('submit',async e=>{
 const f=e.target;if(!['cloudAuthForm','cloudMessageForm','cloudNameForm','cloudPasswordForm'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();
 if(f.id==='cloudAuthForm'){await authSubmit(f);return;}
 if(f.id==='cloudMessageForm'){await sendMessage(f);return;}
 if(!client||!user)return;
 const button=f.querySelector('button');button.disabled=true;
 try{
  if(f.id==='cloudNameForm'){
   const {data,error}=await client.rpc('zos_set_name',{p_name:f.elements.name.value.trim()});if(error)throw error;profileName=data;note(t('nameSaved'),'ok');
  }else{
   const {error}=await client.auth.updateUser({password:f.elements.password.value});if(error)throw error;recovery=false;render();note(t('passwordUpdated'),'ok');
  }
 }catch{note(t('authFailed'),'error');}finally{button.disabled=false;}
},true);
document.addEventListener('input',e=>{if(e.target.id==='cloudMessageInput')chatDraft=e.target.value;});
window.addEventListener('online',()=>{flush();loadMessages();updateStatus();});
window.addEventListener('offline',updateStatus);
window.addEventListener('beforeunload',e=>{if(pending.size){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else if(user){loadMessages();updateStatus();}});
setInterval(()=>{if(user&&ready&&dialog.open&&tab==='room'&&!document.hidden)loadMessages();},15000);
window.ZOSOnline={
 open,
 refreshLabels(){updateStatus();},
 sidebarHTML(){return `<h6>CLOUD</h6><a href="#" data-cloud="account"><span class="n">☁</span><span data-cloud-label="account">${esc(t('account'))}</span></a><a href="#" data-cloud="room"><span class="n">↗</span><span data-cloud-label="room">${esc(t('room'))}</span></a>`;},
 async request(r,language){
  if(!user||!ready){open('account');throw Error(t('noAuth'));}
  const {data,error}=await client.rpc('zos_submit_request',{p_kind:r.kind,p_body:r.msg,p_lang:language});
  if(error)throw Error(t(String(error.message).includes('rate_limited')?'rate':'authFailed'));
  return t('requestSaved')+' (#'+data+')';
 },
 // Observable non-secret state for smoke tests and support. No tokens or email.
 diagnostics(){return {configured:configValid,ready,status:status(),pending:pending.size,conflicts:conflicts.size,realtime};}
};
window.ZOSApp?.hydrate();updateStatus();
async function start(){
 try{
  client=window.supabase.createClient(C.supabaseUrl,C.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'zos-cloud-auth'}});
  client.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{if(event==='PASSWORD_RECOVERY'){recovery=true;open('account');}handleSession(session);},0);});
  const {data,error}=await client.auth.getSession();if(error)throw error;await handleSession(data.session);
 }catch{lastError='authFailed';updateStatus();}
}
if(configValid){
 if(window.supabase?.createClient)start();
 else{
  const sdk=document.createElement('script');sdk.src=C.sdkPath||'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0';sdk.crossOrigin='anonymous';sdk.onload=start;
  sdk.onerror=()=>{lastError='authFailed';updateStatus();if(dialog.open)note(t('authFailed'),'error');};document.head.append(sdk);
 }
}
})();

</script>
